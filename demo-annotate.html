<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NextStep｜上下文批注</title>
  <style>
    :root{--bg:#05090d;--panel:#091119;--surface:#101c26;--surface-2:#13222e;--ink:#edf5f7;--muted:#8ea0aa;--faint:#5c6d77;--line:rgba(170,201,215,.17);--line-strong:rgba(170,201,215,.31);--blue:#69b8e8;--amber:#e4aa5b;--green:#53cf91;--red:#ef806f;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--sans:Inter,"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}body{color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button,textarea{font:inherit;color:inherit}button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .app{display:grid;grid-template-rows:46px minmax(0,1fr);width:100%;height:100%;background:radial-gradient(circle at 68% 8%,rgba(39,108,144,.08),transparent 35%),var(--bg)}
    .topbar{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;min-width:0;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(5,9,13,.94)}
    .brand,.status{display:flex;align-items:center;min-width:0;gap:9px}.brand-mark{display:grid;place-items:center;width:22px;height:22px;border:1px solid rgba(228,170,91,.48);color:var(--amber);font:700 10px/1 var(--mono)}.brand strong{font:600 12px/1 var(--mono);letter-spacing:.08em}.brand span{overflow:hidden;color:var(--faint);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.status{color:var(--muted);font:10px/1 var(--mono);white-space:nowrap}.status i{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px rgba(228,170,91,.75)}
    .canvas{position:relative;min-width:0;min-height:0;overflow:hidden;background:#071019}.canvas::after{position:absolute;inset:0;z-index:1;pointer-events:none;content:"";box-shadow:inset 0 0 100px rgba(0,0,0,.38)}
    .viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background-color:#071019;background-image:linear-gradient(rgba(126,165,183,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(126,165,183,.07) 1px,transparent 1px),linear-gradient(rgba(126,165,183,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(126,165,183,.025) 1px,transparent 1px);background-size:80px 80px,80px 80px,16px 16px,16px 16px}.viewport.is-panning{cursor:grabbing}.viewport.is-annotating{cursor:crosshair}
    .world{position:absolute;top:0;left:0;width:1600px;height:1000px;transform-origin:0 0;will-change:transform}.edges{position:absolute;inset:0;width:1600px;height:1000px;overflow:visible;pointer-events:none}.edge{fill:none;stroke:rgba(105,184,232,.42);stroke-width:1.5;vector-effect:non-scaling-stroke}.note-edge{fill:none;stroke:rgba(228,170,91,.72);stroke-width:1.4;stroke-dasharray:6 6;vector-effect:non-scaling-stroke;animation:dash 8s linear infinite}
    .modebar{position:absolute;z-index:15;top:12px;left:12px;display:flex;align-items:center;gap:5px;max-width:calc(100% - 24px);padding:5px;border:1px solid var(--line-strong);background:rgba(8,16,22,.9);box-shadow:0 12px 32px rgba(0,0,0,.3);backdrop-filter:blur(12px)}.mode-button,.minor-button{min-height:32px;padding:0 11px;border:1px solid transparent;color:var(--muted);background:transparent;font-size:11px;cursor:pointer;white-space:nowrap}.mode-button:hover,.minor-button:hover{color:var(--ink);background:rgba(105,184,232,.08)}.mode-button[aria-pressed="true"]{border-color:rgba(228,170,91,.4);color:#f0d1a4;background:rgba(228,170,91,.11)}.mode-copy{padding:0 7px;color:var(--faint);font:10px/1.3 var(--mono);white-space:nowrap}.minor-button{margin-left:auto;border-left:1px solid var(--line)}
    .node{position:absolute;z-index:3;width:248px;border:1px solid rgba(145,181,198,.32);background:rgba(13,24,33,.97);box-shadow:0 16px 34px rgba(0,0,0,.3)}.node-head,.note-head{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 10px;border-bottom:1px solid var(--line);background:rgba(20,36,47,.68);user-select:none}.node-icon{display:grid;place-items:center;width:17px;height:17px;border:1px solid rgba(105,184,232,.36);color:var(--blue);font:700 9px/1 var(--mono)}.node-title{flex:1;min-width:0;overflow:hidden;font-size:12px;font-weight:650;text-overflow:ellipsis;white-space:nowrap}.node-source{padding:3px 5px;border:1px solid rgba(83,207,145,.26);color:var(--green);font:9px/1 var(--mono)}.node-body{padding:10px}.node-body p{margin:0;color:#cbd8dc;font-size:11.5px;line-height:1.6}.node-meta{display:flex;justify-content:space-between;gap:8px;margin-top:9px;color:var(--faint);font-size:10px}.port{position:absolute;z-index:5;top:50%;width:10px;height:10px;margin-top:-5px;border:2px solid #08121a;border-radius:50%;background:#6ea9c7;box-shadow:0 0 0 1px rgba(142,196,220,.34)}.port.in{left:-6px}.port.out{right:-6px}
    .annotation{position:absolute;z-index:6;width:220px;border:1px solid rgba(228,170,91,.5);background:rgba(28,23,17,.97);box-shadow:0 16px 38px rgba(0,0,0,.38)}.annotation.is-selected{border-color:var(--amber);box-shadow:0 0 0 1px rgba(228,170,91,.18),0 18px 40px rgba(0,0,0,.42)}.note-head{min-height:32px;border-color:rgba(228,170,91,.18);background:rgba(228,170,91,.08);cursor:move}.note-index{color:var(--amber);font:700 9px/1 var(--mono)}.note-anchor{flex:1;min-width:0;overflow:hidden;color:#c9a975;font:9px/1 var(--mono);text-overflow:ellipsis;white-space:nowrap}.note-delete{width:24px;height:24px;border:0;color:#a98773;background:transparent;cursor:pointer}.note-delete:hover{color:var(--red);background:rgba(239,128,111,.08)}.note-body{padding:9px}.note-body textarea{display:block;width:100%;min-height:76px;resize:vertical;border:0;color:#f1e2ca;background:transparent;font-size:11.5px;line-height:1.58}.note-body textarea::placeholder{color:#8e795e}.note-foot{display:flex;align-items:center;justify-content:space-between;margin-top:5px;color:#8e795e;font:9px/1 var(--mono)}.anchor-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px rgba(228,170,91,.7)}
    .controls{position:absolute;z-index:16;right:12px;bottom:12px;display:flex;align-items:center;border:1px solid var(--line-strong);background:rgba(8,16,22,.9);backdrop-filter:blur(12px)}.control{min-width:34px;height:34px;border:0;border-right:1px solid var(--line);color:var(--muted);background:transparent;cursor:pointer}.control:last-child{border-right:0}.control:hover{color:var(--ink);background:rgba(105,184,232,.09)}.zoom-label{min-width:46px;color:var(--faint);font:9px/1 var(--mono);text-align:center}.tip{position:absolute;z-index:10;left:12px;bottom:12px;margin:0;color:rgba(143,164,174,.72);font-size:10px;pointer-events:none}.toast{position:absolute;z-index:25;left:50%;bottom:58px;padding:8px 11px;border:1px solid rgba(83,207,145,.3);color:#c9ecda;background:rgba(8,22,16,.94);font-size:10.5px;opacity:0;transform:translate(-50%,8px);pointer-events:none;transition:.18s}.toast.is-visible{opacity:1;transform:translate(-50%,0)}
    @keyframes dash{to{stroke-dashoffset:-120}}@media(max-width:700px){html,body{overflow:auto}.app{height:720px;min-height:100dvh}.brand span,.status span,.mode-copy{display:none}.modebar{right:12px}.minor-button{padding:0 8px}.annotation{width:200px}.tip{display:none}.controls{bottom:10px;right:10px}}@media(max-width:430px){.modebar{gap:2px}.mode-button,.minor-button{padding:0 8px;font-size:10px}.status{display:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">A</span><strong>NEXTSTEP</strong><span>上下文批注 · 保留判断，不打断执行</span></div>
      <div class="status"><i></i><span id="statusCopy">选择模式 · 可平移画布</span></div>
    </header>
    <section class="canvas" aria-label="上下文批注画布">
      <div class="viewport" id="viewport">
        <div class="world" id="world">
          <svg class="edges" id="edges" viewBox="0 0 1600 1000" aria-hidden="true"></svg>
          <article class="node" data-id="brief" data-x="100" data-y="235">
            <span class="port out"></span><header class="node-head"><span class="node-icon">T</span><strong class="node-title">准备 Beta 发布</strong><span class="node-source">ME</span></header>
            <div class="node-body"><p>完成界面、发布检查和移动端验证，并保留可追溯的执行记录。</p><div class="node-meta"><span>用户意图</span><span>待拆解</span></div></div>
          </article>
          <article class="node" data-id="check" data-x="470" data-y="130">
            <span class="port in"></span><span class="port out"></span><header class="node-head"><span class="node-icon">C</span><strong class="node-title">发布检查</strong><span class="node-source">AI</span></header>
            <div class="node-body"><p>检查资源路径、空状态、错误恢复入口与主要断点。</p><div class="node-meta"><span>执行节点</span><span>进行中</span></div></div>
          </article>
          <article class="node" data-id="mobile" data-x="850" data-y="330">
            <span class="port in"></span><header class="node-head"><span class="node-icon">V</span><strong class="node-title">移动端回归</strong><span class="node-source">AI</span></header>
            <div class="node-body"><p>覆盖 390px 与 768px，确认关键控件没有遮挡且触控可用。</p><div class="node-meta"><span>验证节点</span><span>待确认</span></div></div>
          </article>
          <div id="annotations"></div>
        </div>
      </div>
      <div class="modebar" role="toolbar" aria-label="批注工具">
        <button class="mode-button" id="selectMode" type="button" aria-pressed="true">选择 / 平移</button>
        <button class="mode-button" id="annotateMode" type="button" aria-pressed="false">＋ 批注</button>
        <span class="mode-copy" id="modeCopy">拖动空白平移，滚轮缩放</span>
        <button class="minor-button" id="restore" type="button">恢复示例</button>
      </div>
      <div class="controls" aria-label="缩放控制"><button class="control" id="zoomOut" type="button" aria-label="缩小">−</button><span class="zoom-label" id="zoomLabel">100%</span><button class="control" id="zoomIn" type="button" aria-label="放大">＋</button><button class="control" id="fit" type="button">适配</button></div>
      <p class="tip">选择模式拖动画布 · 批注模式点击空白新增 · 拖动批注标题移动</p>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script>
    (()=>{
      const viewport=document.querySelector('#viewport'),world=document.querySelector('#world'),edges=document.querySelector('#edges'),annotations=document.querySelector('#annotations');
      const selectMode=document.querySelector('#selectMode'),annotateMode=document.querySelector('#annotateMode'),modeCopy=document.querySelector('#modeCopy'),statusCopy=document.querySelector('#statusCopy'),zoomLabel=document.querySelector('#zoomLabel'),toast=document.querySelector('#toast');
      const storageKey='nextstep.demo.annotations.v2';
      const tasks=[...document.querySelectorAll('.node')].map(node=>({id:node.dataset.id,x:+node.dataset.x,y:+node.dataset.y,el:node}));
      const seed=[{id:'note-1',x:760,y:105,text:'这里需要补上失败后的恢复入口，不能只写“重试”。'}];
      let notes=loadNotes(),mode='select',selected=notes[0]?.id||null,view={x:52,y:38,scale:.86},gesture=null,toastTimer=0;
      function loadNotes(){try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');return Array.isArray(saved)?saved.filter(item=>item&&typeof item.id==='string'&&Number.isFinite(item.x)&&Number.isFinite(item.y)&&typeof item.text==='string'):seed.map(item=>({...item}))}catch{return seed.map(item=>({...item}))}}
      function persist(){try{localStorage.setItem(storageKey,JSON.stringify(notes))}catch{}}
      function taskCenter(task){return{x:task.x+task.el.offsetWidth/2,y:task.y+task.el.offsetHeight/2}}
      function nearest(note){const c={x:note.x+110,y:note.y+58};return tasks.reduce((best,task)=>{const p=taskCenter(task),d=(p.x-c.x)**2+(p.y-c.y)**2;return!best||d<best.d?{task,d,p}:best},null).task}
      function curve(a,b){const bend=Math.max(48,Math.abs(b.x-a.x)*.42);return`M ${a.x} ${a.y} C ${a.x+bend} ${a.y}, ${b.x-bend} ${b.y}, ${b.x} ${b.y}`}
      function renderEdges(){const chain=tasks.slice(0,-1).map((task,index)=>{const from={x:task.x+task.el.offsetWidth,y:task.y+task.el.offsetHeight/2},next=tasks[index+1],to={x:next.x,y:next.y+next.el.offsetHeight/2};return`<path class="edge" d="${curve(from,to)}"/>`}).join('');const noteLinks=notes.map(note=>{const task=nearest(note),from={x:note.x+110,y:note.y+58},p=taskCenter(task);return`<path class="note-edge" d="${curve(from,p)}"/>`}).join('');edges.innerHTML=chain+noteLinks}
      function renderNotes(){annotations.textContent='';notes.forEach((note,index)=>{const task=nearest(note),card=document.createElement('article');card.className='annotation'+(note.id===selected?' is-selected':'');card.dataset.id=note.id;card.style.transform=`translate(${note.x}px,${note.y}px)`;card.innerHTML=`<header class="note-head"><span class="note-index">${String(index+1).padStart(2,'0')}</span><span class="note-anchor">关联 · ${task.el.querySelector('.node-title').textContent}</span><button class="note-delete" type="button" aria-label="删除批注">×</button></header><div class="note-body"><textarea aria-label="批注内容" placeholder="记录判断、风险或后续动作…"></textarea><div class="note-foot"><span>自动保存</span><span class="anchor-dot" aria-hidden="true"></span></div></div>`;const area=card.querySelector('textarea');area.value=note.text;area.addEventListener('input',()=>{note.text=area.value;persist()});area.addEventListener('pointerdown',event=>event.stopPropagation());area.addEventListener('focus',()=>{selected=note.id;renderSelection()});card.addEventListener('pointerdown',event=>{if(!event.target.closest('.note-head')||event.target.closest('button'))return;event.preventDefault();event.stopPropagation();selected=note.id;gesture={type:'note',id:note.id,startX:event.clientX,startY:event.clientY,x:note.x,y:note.y};renderSelection()});card.addEventListener('click',event=>{event.stopPropagation();selected=note.id;renderSelection()});card.querySelector('.note-delete').addEventListener('click',event=>{event.stopPropagation();notes=notes.filter(item=>item.id!==note.id);selected=notes[0]?.id||null;persist();renderNotes();renderEdges();showToast('批注已删除')});annotations.appendChild(card)});renderEdges()}
      function renderSelection(){annotations.querySelectorAll('.annotation').forEach(card=>card.classList.toggle('is-selected',card.dataset.id===selected))}
      function setMode(next){mode=next;selectMode.setAttribute('aria-pressed',String(next==='select'));annotateMode.setAttribute('aria-pressed',String(next==='annotate'));viewport.classList.toggle('is-annotating',next==='annotate');modeCopy.textContent=next==='select'?'拖动空白平移，滚轮缩放':'点击画布空白处新增批注';statusCopy.textContent=next==='select'?'选择模式 · 可平移画布':'批注模式 · 点击空白新增'}
      function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;zoomLabel.textContent=Math.round(view.scale*100)+'%'}
      function screenToWorld(clientX,clientY){const rect=viewport.getBoundingClientRect();return{x:(clientX-rect.left-view.x)/view.scale,y:(clientY-rect.top-view.y)/view.scale}}
      function zoomAt(clientX,clientY,factor){const rect=viewport.getBoundingClientRect(),before=screenToWorld(clientX,clientY);view.scale=Math.min(1.55,Math.max(.42,view.scale*factor));view.x=clientX-rect.left-before.x*view.scale;view.y=clientY-rect.top-before.y*view.scale;applyView()}
      function addNote(clientX,clientY){const p=screenToWorld(clientX,clientY),id='note-'+Date.now();notes.push({id,x:Math.max(10,Math.min(1360,p.x-110)),y:Math.max(10,Math.min(820,p.y-55)),text:''});selected=id;persist();renderNotes();requestAnimationFrame(()=>annotations.querySelector(`[data-id="${id}"] textarea`)?.focus());showToast('批注已新增，并关联最近节点')}
      function showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('is-visible');toastTimer=setTimeout(()=>toast.classList.remove('is-visible'),1800)}
      viewport.addEventListener('pointerdown',event=>{if(event.target.closest('.node,.annotation,.modebar,.controls'))return;const canPan=mode==='select'||event.button===1||event.button===2;if(canPan){gesture={type:'pan',startX:event.clientX,startY:event.clientY,x:view.x,y:view.y,moved:false};viewport.classList.add('is-panning')}else if(mode==='annotate'&&event.button===0){gesture={type:'create',startX:event.clientX,startY:event.clientY,moved:false}}});
      window.addEventListener('pointermove',event=>{if(!gesture)return;const dx=event.clientX-gesture.startX,dy=event.clientY-gesture.startY;if(Math.abs(dx)+Math.abs(dy)>5)gesture.moved=true;if(gesture.type==='pan'){view.x=gesture.x+dx;view.y=gesture.y+dy;applyView()}if(gesture.type==='note'){const note=notes.find(item=>item.id===gesture.id);if(!note)return;note.x=Math.max(0,Math.min(1380,gesture.x+dx/view.scale));note.y=Math.max(0,Math.min(850,gesture.y+dy/view.scale));const card=annotations.querySelector(`[data-id="${note.id}"]`);if(card)card.style.transform=`translate(${note.x}px,${note.y}px)`;renderEdges()}});
      window.addEventListener('pointerup',event=>{if(!gesture)return;const current=gesture;gesture=null;viewport.classList.remove('is-panning');if(current.type==='create'&&!current.moved)addNote(event.clientX,event.clientY);if(current.type==='note'){persist();renderNotes()}});window.addEventListener('pointercancel',()=>{const current=gesture;gesture=null;viewport.classList.remove('is-panning');if(current?.type==='note'){persist();renderNotes()}});
      viewport.addEventListener('wheel',event=>{event.preventDefault();zoomAt(event.clientX,event.clientY,event.deltaY<0?1.1:.9)},{passive:false});viewport.addEventListener('contextmenu',event=>event.preventDefault());
      selectMode.addEventListener('click',()=>setMode('select'));annotateMode.addEventListener('click',()=>setMode('annotate'));document.querySelector('#zoomIn').addEventListener('click',()=>{const r=viewport.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.12)});document.querySelector('#zoomOut').addEventListener('click',()=>{const r=viewport.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,.88)});document.querySelector('#fit').addEventListener('click',()=>{view={x:52,y:38,scale:.86};applyView()});document.querySelector('#restore').addEventListener('click',()=>{notes=seed.map(item=>({...item}));selected=notes[0].id;persist();renderNotes();showToast('示例批注已恢复')});window.addEventListener('resize',renderEdges);
      tasks.forEach(task=>{task.el.style.transform=`translate(${task.x}px,${task.y}px)`});setMode('select');applyView();renderNotes();
    })();
  </script>
</body>
</html>
