<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NextStep｜流程收起</title>
  <style>
    :root{--bg:#05090d;--panel:#091119;--surface:#101c26;--ink:#edf5f7;--muted:#8ea0aa;--faint:#5c6d77;--line:rgba(170,201,215,.17);--line-strong:rgba(170,201,215,.31);--blue:#69b8e8;--amber:#e4aa5b;--green:#53cf91;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--sans:Inter,"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}body{color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .app{display:grid;grid-template-rows:46px minmax(0,1fr);width:100%;height:100%;background:radial-gradient(circle at 68% 8%,rgba(39,108,144,.08),transparent 35%),var(--bg)}.topbar{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;min-width:0;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(5,9,13,.94)}.brand,.status{display:flex;align-items:center;min-width:0;gap:9px}.brand-mark{display:grid;place-items:center;width:22px;height:22px;border:1px solid rgba(83,207,145,.48);color:var(--green);font:700 10px/1 var(--mono)}.brand strong{font:600 12px/1 var(--mono);letter-spacing:.08em}.brand span{overflow:hidden;color:var(--faint);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.status{color:var(--muted);font:10px/1 var(--mono);white-space:nowrap}.status i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(83,207,145,.75)}
    .canvas{position:relative;min-width:0;min-height:0;overflow:hidden;background:#071019}.canvas::after{position:absolute;inset:0;z-index:1;pointer-events:none;content:"";box-shadow:inset 0 0 100px rgba(0,0,0,.38)}.canvas-head{position:absolute;z-index:15;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:7px 12px;border-bottom:1px solid var(--line);background:rgba(7,16,25,.91);backdrop-filter:blur(12px)}.head-copy{min-width:0}.head-copy strong{display:block;font-size:12px;font-weight:650}.head-copy span{display:block;overflow:hidden;margin-top:2px;color:var(--faint);font-size:10px;text-overflow:ellipsis;white-space:nowrap}.toolbar{display:flex;align-items:center;gap:5px}.tool{min-height:32px;padding:0 10px;border:1px solid var(--line);color:var(--muted);background:transparent;font-size:10.5px;cursor:pointer;white-space:nowrap}.tool:hover{color:var(--ink);background:rgba(105,184,232,.08)}.tool.primary{border-color:rgba(83,207,145,.42);color:#bde8d0;background:rgba(83,207,145,.09)}.tool.primary:hover{background:rgba(83,207,145,.16)}
    .viewport{position:absolute;z-index:2;inset:52px 0 0;overflow:hidden;cursor:grab;touch-action:none;background-color:#071019;background-image:linear-gradient(rgba(126,165,183,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(126,165,183,.07) 1px,transparent 1px),linear-gradient(rgba(126,165,183,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(126,165,183,.025) 1px,transparent 1px);background-size:80px 80px,80px 80px,16px 16px,16px 16px}.viewport.is-panning{cursor:grabbing}.world{position:absolute;top:0;left:0;width:1800px;height:1100px;transform-origin:0 0;will-change:transform}.edges{position:absolute;inset:0;width:1800px;height:1100px;overflow:visible;pointer-events:none}.edge{fill:none;stroke:rgba(105,184,232,.48);stroke-width:1.5;vector-effect:non-scaling-stroke;transition:opacity .24s,stroke .24s}.edge.is-muted{opacity:.16;stroke:var(--green)}.edge.is-active{stroke:var(--amber);stroke-dasharray:6 5;animation:dash 2.2s linear infinite}
    .node{position:absolute;z-index:3;width:262px;border:1px solid rgba(145,181,198,.32);background:rgba(13,24,33,.97);box-shadow:0 16px 34px rgba(0,0,0,.3);transition:border-color .18s,box-shadow .18s}.node:hover,.node.is-selected{border-color:rgba(105,184,232,.72);box-shadow:0 0 0 1px rgba(105,184,232,.12),0 18px 40px rgba(0,0,0,.4)}.node.is-done{border-color:rgba(83,207,145,.46)}.node-head{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 8px 0 10px;background:rgba(20,36,47,.68);cursor:move;user-select:none}.node:not(.is-collapsed) .node-head{border-bottom:1px solid var(--line)}.node-icon{display:grid;place-items:center;width:17px;height:17px;border:1px solid rgba(105,184,232,.34);color:var(--blue);font:700 9px/1 var(--mono)}.node.is-done .node-icon{border-color:rgba(83,207,145,.38);color:var(--green)}.node-title{flex:1;min-width:0;overflow:hidden;font-size:12px;font-weight:650;text-overflow:ellipsis;white-space:nowrap}.node-state{color:var(--faint);font:9px/1 var(--mono);white-space:nowrap}.node.is-done .node-state{color:var(--green)}.toggle{width:26px;height:26px;border:1px solid transparent;color:var(--muted);background:transparent;font:14px/1 var(--mono);cursor:pointer}.toggle:hover{border-color:var(--line);color:var(--ink);background:rgba(105,184,232,.08)}.node-body{padding:10px}.node.is-collapsed .node-body{display:none}.node-body p{margin:0;color:#cbd8dc;font-size:11.5px;line-height:1.58}.checklist{display:grid;gap:5px;margin:9px 0 0;padding:0;list-style:none;color:var(--muted);font-size:10px}.checklist li::before{display:inline-block;width:14px;color:var(--blue);content:"·"}.node.is-done .checklist li::before{color:var(--green);content:"✓"}.node-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}.node-actions span{color:var(--faint);font:9px/1 var(--mono)}.complete{min-height:28px;padding:0 8px;border:1px solid rgba(83,207,145,.36);color:#bde8d0;background:rgba(83,207,145,.08);font-size:10px;cursor:pointer}.complete:hover{background:rgba(83,207,145,.16)}.port{position:absolute;z-index:5;top:19px;width:10px;height:10px;margin-top:-5px;border:2px solid #08121a;border-radius:50%;background:#6ea9c7}.port.in{left:-6px}.port.out{right:-6px}.node.is-done .port{background:var(--green)}
    .controls{position:absolute;z-index:16;right:12px;bottom:12px;display:flex;align-items:center;border:1px solid var(--line-strong);background:rgba(8,16,22,.9);backdrop-filter:blur(12px)}.control{min-width:34px;height:34px;border:0;border-right:1px solid var(--line);color:var(--muted);background:transparent;cursor:pointer}.control:last-child{border-right:0}.control:hover{color:var(--ink);background:rgba(105,184,232,.09)}.zoom-label{min-width:46px;color:var(--faint);font:9px/1 var(--mono);text-align:center}.tip{position:absolute;z-index:10;left:12px;bottom:12px;margin:0;color:rgba(143,164,174,.72);font-size:10px;pointer-events:none}.toast{position:absolute;z-index:25;left:50%;bottom:58px;padding:8px 11px;border:1px solid rgba(83,207,145,.3);color:#c9ecda;background:rgba(8,22,16,.94);font-size:10.5px;opacity:0;transform:translate(-50%,8px);pointer-events:none;transition:.18s}.toast.is-visible{opacity:1;transform:translate(-50%,0)}
    @keyframes dash{to{stroke-dashoffset:-22}}@media(max-width:700px){.brand span,.status span{display:none}.canvas-head{align-items:flex-start;min-height:88px;flex-direction:column;gap:5px}.head-copy span{display:none}.toolbar{width:100%;overflow-x:auto;padding-bottom:1px}.tool{flex:0 0 auto}.viewport{inset:88px 0 0}.tip{display:none}}@media(max-width:430px){.status{display:none}.canvas-head{padding-left:8px;padding-right:8px}.tool{padding:0 8px;font-size:10px}.node{width:238px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="brand-mark">C</span><strong>NEXTSTEP</strong><span>流程收起 · 完成后让画布自动降噪</span></div><div class="status"><i></i><span id="topStatus">1 / 4 已完成</span></div></header>
    <section class="canvas" aria-label="可收起的任务画布">
      <header class="canvas-head"><div class="head-copy"><strong>Beta 发布 / 执行链</strong><span id="headMeta">单节点可独立收起；完成后自动收起并淡化已走过的连线</span></div><div class="toolbar" role="toolbar" aria-label="收起控制"><button class="tool" id="collapseAll" type="button">全部收起</button><button class="tool" id="expandAll" type="button">全部展开</button><button class="tool primary" id="completeSelected" type="button">完成当前节点</button><button class="tool" id="reset" type="button">重置</button></div></header>
      <div class="viewport" id="viewport"><div class="world" id="world"><svg class="edges" id="edges" viewBox="0 0 1800 1100" aria-hidden="true"></svg><div id="nodes"></div></div></div>
      <div class="controls" aria-label="缩放控制"><button class="control" id="zoomOut" type="button">−</button><span class="zoom-label" id="zoomLabel">100%</span><button class="control" id="zoomIn" type="button">＋</button><button class="control" id="fit" type="button">适配</button></div>
      <p class="tip">节点右上角独立收起 · 拖动节点标题移动 · 拖动空白平移 · 滚轮缩放</p><div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script>
    (()=>{
      const seed=[
        {id:'brief',title:'确认发布范围',copy:'锁定 Beta 的页面、断点与验收边界，避免临近发布继续扩项。',items:['确认页面清单','冻结非必要改动'],x:85,y:250,status:'done',collapsed:true},
        {id:'ui',title:'界面实现',copy:'完成关键页面与空状态，保证主路径可独立验收。',items:['桌面端主路径','移动端关键控件'],x:420,y:115,status:'doing',collapsed:false},
        {id:'check',title:'发布检查',copy:'检查资源路径、错误恢复入口、焦点状态和降级体验。',items:['静态资源可访问','失败后可恢复'],x:760,y:315,status:'todo',collapsed:false},
        {id:'ship',title:'发布与回看',copy:'部署后走查主要路径，记录本轮修订并留下回滚入口。',items:['线上回归','记录发布修订'],x:1110,y:150,status:'todo',collapsed:false}
      ];
      const links=[['brief','ui'],['ui','check'],['check','ship']];let tasks=[],active='ui',view={x:38,y:40,scale:.82},gesture=null,toastTimer=0;
      const viewport=document.querySelector('#viewport'),world=document.querySelector('#world'),nodes=document.querySelector('#nodes'),edges=document.querySelector('#edges'),zoomLabel=document.querySelector('#zoomLabel'),topStatus=document.querySelector('#topStatus'),headMeta=document.querySelector('#headMeta'),toast=document.querySelector('#toast');
      function resetData(){tasks=seed.map(item=>({...item,items:[...item.items]}));active='ui'}function current(){return tasks.find(item=>item.id===active)||tasks[0]}function label(status){return status==='done'?'已完成':status==='doing'?'进行中':'待开始'}
      function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
      function curve(from,to){const bend=Math.max(46,Math.abs(to.x-from.x)*.42);return`M ${from.x} ${from.y} C ${from.x+bend} ${from.y}, ${to.x-bend} ${to.y}, ${to.x} ${to.y}`}
      function renderEdges(){edges.innerHTML=links.map(link=>{const fromTask=tasks.find(item=>item.id===link[0]),toTask=tasks.find(item=>item.id===link[1]),a=nodes.querySelector(`[data-id="${link[0]}"]`),b=nodes.querySelector(`[data-id="${link[1]}"]`);if(!a||!b)return'';const from={x:fromTask.x+a.offsetWidth,y:fromTask.y+19},to={x:toTask.x,y:toTask.y+19},muted=fromTask.status==='done',activeEdge=fromTask.id===active&&fromTask.status!=='done';return`<path class="edge${muted?' is-muted':''}${activeEdge?' is-active':''}" d="${curve(from,to)}"/>`}).join('')}
      function renderNodes(){nodes.textContent='';tasks.forEach(task=>{const node=document.createElement('article');node.className=`node${task.id===active?' is-selected':''}${task.collapsed?' is-collapsed':''}${task.status==='done'?' is-done':''}`;node.dataset.id=task.id;node.style.transform=`translate(${task.x}px,${task.y}px)`;node.innerHTML=`<span class="port in"></span><span class="port out"></span><header class="node-head"><span class="node-icon">${task.status==='done'?'✓':'T'}</span><strong class="node-title">${escapeHtml(task.title)}</strong><span class="node-state">${label(task.status)}</span><button class="toggle" type="button" aria-label="${task.collapsed?'展开':'收起'}${escapeHtml(task.title)}" aria-expanded="${!task.collapsed}">${task.collapsed?'＋':'−'}</button></header><div class="node-body"><p>${escapeHtml(task.copy)}</p><ul class="checklist">${task.items.map(item=>`<li>${escapeHtml(item)}</li>`).join('')}</ul><div class="node-actions"><span>${task.status==='done'?'自动收起已启用':'完成后自动收起'}</span>${task.status==='done'?'':`<button class="complete" type="button">标记完成</button>`}</div></div>`;node.addEventListener('click',()=>{active=task.id;renderAll()});node.querySelector('.toggle').addEventListener('click',event=>{event.stopPropagation();task.collapsed=!task.collapsed;active=task.id;renderAll();showToast(task.collapsed?'节点已收起':'节点已展开')});node.querySelector('.complete')?.addEventListener('click',event=>{event.stopPropagation();complete(task)});node.querySelector('.node-head').addEventListener('pointerdown',event=>{if(event.target.closest('button')||event.button!==0)return;event.preventDefault();event.stopPropagation();active=task.id;gesture={type:'node',id:task.id,startX:event.clientX,startY:event.clientY,x:task.x,y:task.y};nodes.querySelectorAll('.node').forEach(el=>el.classList.toggle('is-selected',el.dataset.id===active));renderSummary()});nodes.appendChild(node)});requestAnimationFrame(renderEdges)}
      function renderSummary(){const done=tasks.filter(task=>task.status==='done').length,collapsed=tasks.filter(task=>task.collapsed).length;topStatus.textContent=`${done} / ${tasks.length} 已完成`;headMeta.textContent=`${collapsed} 个节点已收起 · 已完成连线自动淡化`;const button=document.querySelector('#completeSelected'),item=current();button.disabled=item.status==='done';button.textContent=item.status==='done'?'当前节点已完成':'完成当前节点'}
      function renderAll(){renderNodes();renderSummary()}
      function complete(task){if(task.status==='done'){showToast('这个节点已经完成');return}task.status='done';task.collapsed=true;const index=tasks.indexOf(task),next=tasks[index+1];if(next&&next.status==='todo')next.status='doing';active=next?.id||task.id;renderAll();showToast(`「${task.title}」已完成并自动收起`)}
      function setAll(collapsed){tasks.forEach(task=>task.collapsed=collapsed);renderAll();showToast(collapsed?'全部节点已收起':'全部节点已展开')}
      function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;zoomLabel.textContent=Math.round(view.scale*100)+'%'}
      function screenToWorld(clientX,clientY){const rect=viewport.getBoundingClientRect();return{x:(clientX-rect.left-view.x)/view.scale,y:(clientY-rect.top-view.y)/view.scale}}
      function zoomAt(clientX,clientY,factor){const rect=viewport.getBoundingClientRect(),before=screenToWorld(clientX,clientY);view.scale=Math.min(1.5,Math.max(.42,view.scale*factor));view.x=clientX-rect.left-before.x*view.scale;view.y=clientY-rect.top-before.y*view.scale;applyView()}
      function showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('is-visible');toastTimer=setTimeout(()=>toast.classList.remove('is-visible'),1700)}
      viewport.addEventListener('pointerdown',event=>{if(event.target.closest('.node'))return;gesture={type:'pan',startX:event.clientX,startY:event.clientY,x:view.x,y:view.y};viewport.classList.add('is-panning')});window.addEventListener('pointermove',event=>{if(!gesture)return;const dx=event.clientX-gesture.startX,dy=event.clientY-gesture.startY;if(gesture.type==='pan'){view.x=gesture.x+dx;view.y=gesture.y+dy;applyView()}if(gesture.type==='node'){const task=tasks.find(item=>item.id===gesture.id);if(!task)return;task.x=Math.max(0,Math.min(1500,gesture.x+dx/view.scale));task.y=Math.max(0,Math.min(900,gesture.y+dy/view.scale));const node=nodes.querySelector(`[data-id="${task.id}"]`);if(node)node.style.transform=`translate(${task.x}px,${task.y}px)`;renderEdges()}});const endGesture=()=>{gesture=null;viewport.classList.remove('is-panning')};window.addEventListener('pointerup',endGesture);window.addEventListener('pointercancel',endGesture);viewport.addEventListener('wheel',event=>{event.preventDefault();zoomAt(event.clientX,event.clientY,event.deltaY<0?1.1:.9)},{passive:false});
      document.querySelector('#collapseAll').addEventListener('click',()=>setAll(true));document.querySelector('#expandAll').addEventListener('click',()=>setAll(false));document.querySelector('#completeSelected').addEventListener('click',()=>complete(current()));document.querySelector('#zoomIn').addEventListener('click',()=>{const r=viewport.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.12)});document.querySelector('#zoomOut').addEventListener('click',()=>{const r=viewport.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,.88)});document.querySelector('#fit').addEventListener('click',()=>{view={x:38,y:40,scale:.82};applyView()});document.querySelector('#reset').addEventListener('click',()=>{resetData();view={x:38,y:40,scale:.82};applyView();renderAll();showToast('收起状态与进度已重置')});window.addEventListener('resize',renderEdges);
      resetData();applyView();renderAll();
    })();
  </script>
</body>
</html>
