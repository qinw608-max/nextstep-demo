<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NextStep｜流程模板</title>
  <style>
    :root{--bg:#05090d;--panel:#091119;--panel-2:#0c1721;--surface:#101c26;--ink:#edf5f7;--muted:#8ea0aa;--faint:#5c6d77;--line:rgba(170,201,215,.17);--line-strong:rgba(170,201,215,.31);--blue:#69b8e8;--amber:#e4aa5b;--green:#53cf91;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--sans:Inter,"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}body{color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .app{display:grid;grid-template-rows:46px minmax(0,1fr);width:100%;height:100%;background:radial-gradient(circle at 68% 8%,rgba(39,108,144,.08),transparent 35%),var(--bg)}.topbar{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;min-width:0;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(5,9,13,.94)}.brand,.status{display:flex;align-items:center;min-width:0;gap:9px}.brand-mark{display:grid;place-items:center;width:22px;height:22px;border:1px solid rgba(228,170,91,.48);color:var(--amber);font:700 10px/1 var(--mono)}.brand strong{font:600 12px/1 var(--mono);letter-spacing:.08em}.brand span{overflow:hidden;color:var(--faint);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.status{color:var(--muted);font:10px/1 var(--mono);white-space:nowrap}.status i{width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px rgba(228,170,91,.75)}
    .workarea{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}.canvas{position:relative;min-width:0;min-height:0;overflow:hidden;background:#071019}.canvas::after{position:absolute;inset:0;z-index:1;pointer-events:none;content:"";box-shadow:inset 0 0 100px rgba(0,0,0,.38)}.canvas-head{position:absolute;z-index:15;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:7px 12px;border-bottom:1px solid var(--line);background:rgba(7,16,25,.91);backdrop-filter:blur(12px)}.head-copy{min-width:0}.head-copy strong{display:block;font-size:12px;font-weight:650}.head-copy span{display:block;overflow:hidden;margin-top:2px;color:var(--faint);font-size:10px;text-overflow:ellipsis;white-space:nowrap}.toolbar{display:flex;align-items:center;gap:5px}.tool{min-height:32px;padding:0 10px;border:1px solid var(--line);color:var(--muted);background:transparent;font-size:10.5px;cursor:pointer;white-space:nowrap}.tool:hover{color:var(--ink);background:rgba(105,184,232,.08)}.tool.primary{border-color:rgba(228,170,91,.45);color:#f0d1a4;background:rgba(228,170,91,.1)}.tool.primary:hover{background:rgba(228,170,91,.17)}.tool:disabled{opacity:.42;cursor:default}
    .viewport{position:absolute;z-index:2;inset:52px 0 0;overflow:hidden;cursor:grab;touch-action:none;background-color:#071019;background-image:linear-gradient(rgba(126,165,183,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(126,165,183,.07) 1px,transparent 1px),linear-gradient(rgba(126,165,183,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(126,165,183,.025) 1px,transparent 1px);background-size:80px 80px,80px 80px,16px 16px,16px 16px}.viewport.is-panning{cursor:grabbing}.world{position:absolute;top:0;left:0;width:2100px;height:1300px;transform-origin:0 0;will-change:transform}.edges{position:absolute;inset:0;width:2100px;height:1300px;overflow:visible;pointer-events:none}.edge{fill:none;stroke:rgba(83,207,145,.44);stroke-width:1.5;vector-effect:non-scaling-stroke}.edge.template-link{stroke:var(--amber);stroke-dasharray:6 5;animation:dash 2.3s linear infinite}.edge.instance-link{stroke:rgba(105,184,232,.55)}
    .node,.template-node{position:absolute;z-index:3;width:246px;border:1px solid rgba(145,181,198,.32);background:rgba(13,24,33,.97);box-shadow:0 16px 34px rgba(0,0,0,.3);transition:border-color .18s,box-shadow .18s}.node:hover,.node.is-selected{border-color:rgba(105,184,232,.7);box-shadow:0 0 0 1px rgba(105,184,232,.12),0 18px 40px rgba(0,0,0,.4)}.node.source{border-color:rgba(83,207,145,.24)}.node.source.is-included{border-color:rgba(83,207,145,.64);box-shadow:0 0 0 1px rgba(83,207,145,.1),0 18px 40px rgba(0,0,0,.34)}.node.instance{border-color:rgba(105,184,232,.4)}.node-head{display:flex;align-items:center;gap:8px;min-height:35px;padding:0 10px;border-bottom:1px solid var(--line);background:rgba(20,36,47,.68);cursor:move;user-select:none}.node-icon{display:grid;place-items:center;width:17px;height:17px;border:1px solid rgba(83,207,145,.36);color:var(--green);font:700 9px/1 var(--mono)}.node.source:not(.is-included) .node-icon{border-color:var(--line);color:var(--faint)}.node.instance .node-icon{border-color:rgba(105,184,232,.36);color:var(--blue)}.node-title{flex:1;min-width:0;overflow:hidden;font-size:12px;font-weight:650;text-overflow:ellipsis;white-space:nowrap}.node-state{color:var(--green);font:9px/1 var(--mono)}.node.instance .node-state{color:var(--blue)}.node-body{padding:10px}.node-body p{margin:0;color:#cbd8dc;font-size:11.5px;line-height:1.58}.node-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;color:var(--faint);font-size:9.5px}.include-toggle{min-height:24px;padding:0 7px;border:1px solid var(--line);color:var(--muted);background:rgba(3,8,12,.44);font:9px/1 var(--mono);cursor:pointer}.include-toggle[aria-pressed="true"]{border-color:rgba(83,207,145,.4);color:var(--green);background:rgba(83,207,145,.08)}.include-toggle:disabled{opacity:.58;cursor:default}.port{position:absolute;z-index:5;top:50%;width:10px;height:10px;margin-top:-5px;border:2px solid #08121a;border-radius:50%;background:#6ea9c7}.port.in{left:-6px}.port.out{right:-6px}
    .template-node{z-index:4;width:270px;border-color:rgba(228,170,91,.56);background:rgba(30,24,17,.97);opacity:0;transform:scale(.96);pointer-events:none;transition:opacity .2s,transform .2s}.template-node.is-visible{opacity:1;transform:none;pointer-events:auto}.template-node .node-head{border-color:rgba(228,170,91,.2);background:rgba(228,170,91,.09)}.template-node .node-icon{border-color:rgba(228,170,91,.4);color:var(--amber)}.template-node .node-state{color:var(--amber)}.template-steps{display:grid;gap:6px;margin:0;padding:0;list-style:none;color:#d8c5a8;font-size:10.5px}.template-steps li{display:flex;align-items:center;gap:7px}.template-steps li::before{display:grid;place-items:center;width:17px;height:17px;border:1px solid rgba(228,170,91,.28);color:var(--amber);font:8px/1 var(--mono);content:attr(data-step)}
    .inspector{position:relative;z-index:6;min-width:0;min-height:0;overflow:auto;border-left:1px solid var(--line-strong);background:rgba(8,15,21,.98)}.inspect-head{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 14px;border-bottom:1px solid var(--line)}.inspect-head strong{font-size:13px;font-weight:650}.inspect-head span{color:var(--faint);font:9px/1 var(--mono)}.inspect-body{padding:14px}.eyebrow{margin:0 0 6px;color:var(--amber);font:9px/1 var(--mono);letter-spacing:.08em}.inspect-body h2{margin:0;font-size:17px;font-weight:650}.inspect-copy{margin:7px 0 14px;color:var(--muted);font-size:11.5px;line-height:1.6}.preview-list{display:grid;gap:7px;margin:0 0 14px;padding:0;list-style:none}.preview-list li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);background:rgba(16,28,38,.6)}.preview-list b{display:grid;place-items:center;width:24px;height:24px;border:1px solid rgba(228,170,91,.28);color:var(--amber);font:9px/1 var(--mono)}.preview-list strong{display:block;font-size:11px}.preview-list span{display:block;margin-top:2px;color:var(--faint);font-size:9.5px}.rule{margin:12px 0;border:0;border-top:1px solid var(--line)}.field label{display:block;margin-bottom:5px;color:var(--muted);font-size:10px}.field input{width:100%;height:36px;padding:0 9px;border:1px solid var(--line-strong);background:rgba(3,8,12,.62);font-size:11px}.confirm{width:100%;min-height:38px;margin-top:8px;border:1px solid rgba(83,207,145,.54);color:#06130d;background:var(--green);font-size:11.5px;font-weight:700;cursor:pointer}.confirm:hover:not(:disabled){filter:brightness(1.08)}.confirm:disabled{border-color:var(--line);color:var(--faint);background:rgba(116,135,144,.08);cursor:default}.inspect-note{margin:10px 0 0;color:var(--faint);font-size:9.5px;line-height:1.55}.instance-log{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.instance-log strong{font-size:10.5px}.instance-log ul{margin:7px 0 0;padding-left:16px;color:var(--muted);font-size:10px}.empty{padding:16px 0;color:var(--muted);font-size:11.5px;line-height:1.7}.empty b{display:block;margin-bottom:5px;color:var(--ink);font-size:13px}
    .controls{position:absolute;z-index:16;right:12px;bottom:12px;display:flex;align-items:center;border:1px solid var(--line-strong);background:rgba(8,16,22,.9);backdrop-filter:blur(12px)}.control{min-width:34px;height:34px;border:0;border-right:1px solid var(--line);color:var(--muted);background:transparent;cursor:pointer}.control:last-child{border-right:0}.control:hover{color:var(--ink);background:rgba(105,184,232,.09)}.zoom-label{min-width:46px;color:var(--faint);font:9px/1 var(--mono);text-align:center}.tip{position:absolute;z-index:10;left:12px;bottom:12px;margin:0;color:rgba(143,164,174,.72);font-size:10px;pointer-events:none}.toast{position:absolute;z-index:25;left:50%;bottom:58px;padding:8px 11px;border:1px solid rgba(83,207,145,.3);color:#c9ecda;background:rgba(8,22,16,.94);font-size:10.5px;opacity:0;transform:translate(-50%,8px);pointer-events:none;transition:.18s}.toast.is-visible{opacity:1;transform:translate(-50%,0)}
    @keyframes dash{to{stroke-dashoffset:-22}}@media(max-width:860px){.workarea{grid-template-columns:minmax(0,1fr) 270px}.tool{padding:0 8px}}@media(max-width:700px){html,body{overflow:auto}.app{height:auto;min-height:1000px;grid-template-rows:44px auto}.workarea{grid-template-columns:1fr;grid-template-rows:620px auto}.canvas{min-height:620px}.inspector{min-height:330px;border-top:1px solid var(--line-strong);border-left:0}.brand span,.status span{display:none}.tip{display:none}}@media(max-width:460px){.canvas-head{align-items:flex-start;min-height:88px;flex-direction:column;gap:5px}.head-copy span{display:none}.viewport{inset:88px 0 0}.toolbar{width:100%}.tool{flex:1}.status{display:none}.node{width:224px}.template-node{width:240px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="brand-mark">T</span><strong>NEXTSTEP</strong><span>流程模板 · 复用执行结构，不复制旧内容</span></div><div class="status"><i></i><span id="topStatus">来源链已完成 · 可沉淀</span></div></header>
    <section class="workarea">
      <section class="canvas" aria-label="流程模板画布">
        <header class="canvas-head"><div class="head-copy"><strong>发布流程 / 模板工作区</strong><span id="headMeta">选择完成节点链，沉淀为可预览的执行模板</span></div><div class="toolbar"><button class="tool primary" id="extract" type="button">沉淀为模板</button><button class="tool" id="focusTemplate" type="button" disabled>查看模板</button><button class="tool" id="reset" type="button">重置</button></div></header>
        <div class="viewport" id="viewport"><div class="world" id="world"><svg class="edges" id="edges" viewBox="0 0 2100 1300" aria-hidden="true"></svg><div id="nodes"></div><article class="template-node" id="templateNode"><span class="port in"></span><span class="port out"></span><header class="node-head"><span class="node-icon">TPL</span><strong class="node-title">发布准备模板</strong><span class="node-state">可复用</span></header><div class="node-body"><ul class="template-steps"><li data-step="01">界面修整</li><li data-step="02">发布检查</li><li data-step="03">交付回看</li></ul><div class="node-meta"><span>只保留结构</span><span>3 个步骤</span></div></div></article></div></div>
        <div class="controls" aria-label="缩放控制"><button class="control" id="zoomOut" type="button">−</button><span class="zoom-label" id="zoomLabel">100%</span><button class="control" id="zoomIn" type="button">＋</button><button class="control" id="fit" type="button">适配</button></div>
        <p class="tip">拖动节点标题移动 · 拖动空白平移 · 滚轮缩放</p><div class="toast" id="toast" role="status" aria-live="polite"></div>
      </section>
      <aside class="inspector" aria-label="模板预览">
        <header class="inspect-head"><strong>模板预览</strong><span id="inspectState">等待沉淀</span></header><div class="inspect-body" id="inspectBody"></div>
      </aside>
    </section>
  </main>
  <script>
    (()=>{
      const steps=[{title:'界面修整',copy:'整理关键页面与空状态'},{title:'发布检查',copy:'检查路径、断点与恢复入口'},{title:'交付回看',copy:'上线走查并记录修订'}];
      const sourceSeed=steps.map((step,index)=>({id:'source-'+index,title:step.title,copy:step.copy,x:80+index*330,y:index%2?315:150,status:'已完成',kind:'source',group:'首页发布',included:true}));
      let nodesData=[],links=[],templateReady=false,templateSteps=[],instances=[],active='source-0',view={x:34,y:34,scale:.76},gesture=null,toastTimer=0;
      const viewport=document.querySelector('#viewport'),world=document.querySelector('#world'),edges=document.querySelector('#edges'),nodes=document.querySelector('#nodes'),templateNode=document.querySelector('#templateNode'),inspectBody=document.querySelector('#inspectBody'),inspectState=document.querySelector('#inspectState'),topStatus=document.querySelector('#topStatus'),headMeta=document.querySelector('#headMeta'),zoomLabel=document.querySelector('#zoomLabel'),toast=document.querySelector('#toast'),extract=document.querySelector('#extract'),focusTemplate=document.querySelector('#focusTemplate');
      function resetData(){nodesData=sourceSeed.map(item=>({...item}));links=[['source-0','source-1','source'],['source-1','source-2','source']];templateReady=false;templateSteps=[];instances=[];active='source-0'}
      function selectedSources(){return nodesData.filter(item=>item.kind==='source'&&item.status==='已完成'&&item.included)}
      function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
      function curve(from,to){const bend=Math.max(45,Math.abs(to.x-from.x)*.42);return`M ${from.x} ${from.y} C ${from.x+bend} ${from.y}, ${to.x-bend} ${to.y}, ${to.x} ${to.y}`}
      function templatePosition(){return{x:1050,y:180,w:270,h:190}}
      function renderEdges(){const paths=links.map(link=>{const aData=nodesData.find(item=>item.id===link[0]),bData=nodesData.find(item=>item.id===link[1]),a=nodes.querySelector(`[data-id="${link[0]}"]`),b=nodes.querySelector(`[data-id="${link[1]}"]`);if(!aData||!bData||!a||!b)return'';return`<path class="edge${link[2]==='instance'?' instance-link':''}" d="${curve({x:aData.x+a.offsetWidth,y:aData.y+a.offsetHeight/2},{x:bData.x,y:bData.y+b.offsetHeight/2})}"/>`}).join('');let bridge='';if(templateReady){const lastStep=templateSteps[templateSteps.length-1],last=nodesData.find(item=>item.id===lastStep?.id),lastEl=last&&nodes.querySelector(`[data-id="${last.id}"]`),tpl=templatePosition();if(last&&lastEl)bridge+=`<path class="edge template-link" d="${curve({x:last.x+lastEl.offsetWidth,y:last.y+lastEl.offsetHeight/2},{x:tpl.x,y:tpl.y+tpl.h/2})}"/>`;instances.forEach(instance=>{const first=nodesData.find(item=>item.id===instance.ids[0]);if(first)bridge+=`<path class="edge template-link" d="${curve({x:tpl.x+tpl.w,y:tpl.y+tpl.h/2},{x:first.x,y:first.y+55})}"/>`})}edges.innerHTML=paths+bridge}
      function renderNodes(){nodes.textContent='';nodesData.forEach(item=>{const included=item.kind==='source'&&item.included;const node=document.createElement('article');node.className=`node ${item.kind}${item.id===active?' is-selected':''}${included?' is-included':''}`;node.dataset.id=item.id;node.style.transform=`translate(${item.x}px,${item.y}px)`;node.innerHTML=`<span class="port in"></span><span class="port out"></span><header class="node-head"><span class="node-icon">${item.kind==='source'?(included?'✓':'○'):'T'}</span><strong class="node-title">${escapeHtml(item.title)}</strong><span class="node-state">${escapeHtml(item.status)}</span></header><div class="node-body"><p>${escapeHtml(item.copy)}</p><div class="node-meta"><span>${escapeHtml(item.group)}</span>${item.kind==='source'?`<button class="include-toggle" type="button" aria-pressed="${included}"${templateReady?' disabled':''}>${templateReady?'已提炼':included?'已选入':'选入模板'}</button>`:'<span>新任务节点</span>'}</div></div>`;node.addEventListener('click',event=>{if(event.target.closest('.include-toggle'))return;active=item.id;renderNodes()});const toggle=node.querySelector('.include-toggle');toggle?.addEventListener('click',event=>{event.stopPropagation();if(templateReady)return;item.included=!item.included;active=item.id;renderAll();const count=selectedSources().length,missing=Math.max(0,2-count);showToast(item.included?`已选入「${item.title}」`:`已取消「${item.title}」${missing?`，还需 ${missing} 个已完成节点`:''}`)});node.querySelector('.node-head').addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();event.stopPropagation();active=item.id;gesture={type:'node',id:item.id,startX:event.clientX,startY:event.clientY,x:item.x,y:item.y};nodes.querySelectorAll('.node').forEach(el=>el.classList.toggle('is-selected',el.dataset.id===active))});nodes.appendChild(node)});const previewSteps=templateReady?templateSteps:selectedSources();templateNode.querySelector('.template-steps').innerHTML=previewSteps.map((step,index)=>`<li data-step="${String(index+1).padStart(2,'0')}">${escapeHtml(step.title)}</li>`).join('');templateNode.querySelector('.node-meta span:last-child').textContent=`${previewSteps.length} 个步骤`;templateNode.style.left=templatePosition().x+'px';templateNode.style.top=templatePosition().y+'px';templateNode.classList.toggle('is-visible',templateReady);requestAnimationFrame(renderEdges)}
      function renderInspector(){const selected=selectedSources();if(!templateReady){inspectState.textContent=`已选 ${selected.length} / ${sourceSeed.length}`;inspectBody.innerHTML=`<div class="empty"><b>选择至少 2 个已完成节点</b>当前来源是“首页发布”的完成链。用节点卡片中的“已选入 / 选入模板”控制范围，模板只提炼被选节点的结构。</div><ul class="preview-list">${nodesData.filter(item=>item.kind==='source').map((step,index)=>`<li><b>${String(index+1).padStart(2,'0')}</b><div><strong>${escapeHtml(step.title)}</strong><span>${step.included?'已选入模板':'未选入'} · ${escapeHtml(step.status)}</span></div></li>`).join('')}</ul>`;return}inspectState.textContent=instances.length?`已应用 ${instances.length} 次`:'等待确认';inspectBody.innerHTML=`<p class="eyebrow">PUBLISH / ${templateSteps.length} STEPS</p><h2>发布准备模板</h2><p class="inspect-copy">仅保留所选节点的顺序、动作名称与验收意图，不携带“首页发布”的旧任务内容。</p><ul class="preview-list">${templateSteps.map((step,index)=>`<li><b>${String(index+1).padStart(2,'0')}</b><div><strong>${escapeHtml(step.title)}</strong><span>${escapeHtml(step.copy)}</span></div></li>`).join('')}</ul><hr class="rule"><div class="field"><label for="targetName">新任务名称</label><input id="targetName" value="${instances.length?'下一轮发布':'作品详情页发布'}" maxlength="32"></div><button class="confirm" id="applyTemplate" type="button">确认应用并生成节点</button><p class="inspect-note">确认后会在画布中实例化一条全新的待办链，模板本身保持不变。</p>${instances.length?`<div class="instance-log"><strong>已生成实例</strong><ul>${instances.map(item=>`<li>${escapeHtml(item.name)} · ${templateSteps.length} 个节点</li>`).join('')}</ul></div>`:''}`;document.querySelector('#applyTemplate').addEventListener('click',applyTemplate);document.querySelector('#targetName').addEventListener('keydown',event=>{if(event.key==='Enter')applyTemplate()})}
      function renderSummary(){const selected=selectedSources(),enough=selected.length>=2;extract.disabled=templateReady||!enough;extract.title=!enough?'至少选择 2 个已完成节点':'';extract.textContent=templateReady?'模板已沉淀':`沉淀为模板 · ${selected.length}`;focusTemplate.disabled=!templateReady;topStatus.textContent=templateReady?(instances.length?`${instances.length} 条新任务链已实例化`:'模板已生成 · 等待确认应用'):(enough?`已选 ${selected.length} 个完成节点 · 可沉淀`:`已选 ${selected.length} 个 · 至少需要 2 个`);headMeta.textContent=templateReady?'模板可反复预览与实例化，来源节点保持不变':`已选 ${selected.length} / ${sourceSeed.length} 个完成节点，模板仅提炼所选结构`}
      function renderAll(){renderNodes();renderInspector();renderSummary()}
      function extractTemplate(){if(templateReady)return;const selected=selectedSources();if(selected.length<2){showToast('请至少选择 2 个已完成节点后再沉淀');return}templateSteps=selected.map(item=>({id:item.id,title:item.title,copy:item.copy}));templateReady=true;renderAll();showToast(`已将 ${templateSteps.length} 个完成节点沉淀为模板`);setTimeout(()=>focusOn(templatePosition().x,templatePosition().y,.84),80)}
      function applyTemplate(){const input=document.querySelector('#targetName'),name=(input?.value||'新发布任务').trim()||'新发布任务',run=instances.length,ids=[];templateSteps.forEach((step,index)=>{const id=`instance-${Date.now()}-${index}`,item={id,title:step.title,copy:`用于「${name}」：${step.copy}。`,x:1420+index*300,y:470+run*220+(index%2?90:0),status:'待开始',kind:'instance',group:name};nodesData.push(item);ids.push(id);if(index)links.push([ids[index-1],id,'instance'])});instances.push({name,ids});active=ids[0];renderAll();showToast(`已实例化「${name}」的 ${templateSteps.length} 个任务节点`);setTimeout(()=>focusOn(nodesData.find(item=>item.id===ids[0]).x,nodesData.find(item=>item.id===ids[0]).y,.72),80)}
      function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;zoomLabel.textContent=Math.round(view.scale*100)+'%'}
      function screenToWorld(clientX,clientY){const rect=viewport.getBoundingClientRect();return{x:(clientX-rect.left-view.x)/view.scale,y:(clientY-rect.top-view.y)/view.scale}}
      function zoomAt(clientX,clientY,factor){const rect=viewport.getBoundingClientRect(),before=screenToWorld(clientX,clientY);view.scale=Math.min(1.45,Math.max(.36,view.scale*factor));view.x=clientX-rect.left-before.x*view.scale;view.y=clientY-rect.top-before.y*view.scale;applyView()}
      function focusOn(x,y,scale=.8){const rect=viewport.getBoundingClientRect();view.scale=scale;view.x=rect.width/2-(x+130)*scale;view.y=rect.height/2-(y+90)*scale;applyView()}
      function showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('is-visible');toastTimer=setTimeout(()=>toast.classList.remove('is-visible'),1800)}
      viewport.addEventListener('pointerdown',event=>{if(event.target.closest('.node,.template-node'))return;gesture={type:'pan',startX:event.clientX,startY:event.clientY,x:view.x,y:view.y};viewport.classList.add('is-panning')});window.addEventListener('pointermove',event=>{if(!gesture)return;const dx=event.clientX-gesture.startX,dy=event.clientY-gesture.startY;if(gesture.type==='pan'){view.x=gesture.x+dx;view.y=gesture.y+dy;applyView()}if(gesture.type==='node'){const item=nodesData.find(node=>node.id===gesture.id);if(!item)return;item.x=Math.max(0,Math.min(1810,gesture.x+dx/view.scale));item.y=Math.max(0,Math.min(1100,gesture.y+dy/view.scale));const node=nodes.querySelector(`[data-id="${item.id}"]`);if(node)node.style.transform=`translate(${item.x}px,${item.y}px)`;renderEdges()}});const endGesture=()=>{gesture=null;viewport.classList.remove('is-panning')};window.addEventListener('pointerup',endGesture);window.addEventListener('pointercancel',endGesture);viewport.addEventListener('wheel',event=>{event.preventDefault();zoomAt(event.clientX,event.clientY,event.deltaY<0?1.1:.9)},{passive:false});templateNode.addEventListener('click',()=>{renderInspector();showToast('模板预览已打开')});
      extract.addEventListener('click',extractTemplate);focusTemplate.addEventListener('click',()=>{if(templateReady){renderInspector();focusOn(templatePosition().x,templatePosition().y,.84)}});document.querySelector('#zoomIn').addEventListener('click',()=>{const r=viewport.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.12)});document.querySelector('#zoomOut').addEventListener('click',()=>{const r=viewport.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,.88)});document.querySelector('#fit').addEventListener('click',()=>{view={x:34,y:34,scale:.76};applyView()});document.querySelector('#reset').addEventListener('click',()=>{resetData();view={x:34,y:34,scale:.76};applyView();renderAll();showToast('模板与新任务实例已重置')});window.addEventListener('resize',renderEdges);
      resetData();applyView();renderAll();
    })();
  </script>
</body>
</html>
