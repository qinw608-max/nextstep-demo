<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>NextStep｜渐进资产扫描</title>
  <style>
    :root {
      --bg: #05090d;
      --panel: #091119;
      --panel-2: #0c1721;
      --surface: #101c26;
      --ink: #edf5f7;
      --muted: #8ea0aa;
      --faint: #5c6d77;
      --line: rgba(170, 201, 215, .16);
      --line-strong: rgba(170, 201, 215, .3);
      --blue: #69b8e8;
      --blue-soft: rgba(76, 164, 220, .14);
      --amber: #e4aa5b;
      --amber-soft: rgba(228, 170, 91, .12);
      --green: #53cf91;
      --green-soft: rgba(83, 207, 145, .12);
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --sans: Inter, "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
    body { color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
    button { color: inherit; font: inherit; }
    button:focus-visible, [tabindex="0"]:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .app { display: grid; grid-template-rows: 46px minmax(0, 1fr); width: 100%; height: 100%; background: radial-gradient(circle at 50% 20%, rgba(51, 122, 158, .08), transparent 38%), var(--bg); }
    .topbar { position: relative; z-index: 30; display: flex; align-items: center; justify-content: space-between; min-width: 0; padding: 0 14px; border-bottom: 1px solid var(--line); background: rgba(5, 9, 13, .94); }
    .brand { display: flex; align-items: center; min-width: 0; gap: 10px; }
    .brand-mark { display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid rgba(83, 207, 145, .5); color: var(--green); font: 700 11px/1 var(--mono); }
    .brand strong { font: 600 12px/1 var(--mono); letter-spacing: .08em; }
    .brand span { overflow: hidden; color: var(--faint); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .run-state { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 10px/1 var(--mono); white-space: nowrap; }
    .run-state i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
    .run-state[data-phase="scanning"] i { background: var(--blue); box-shadow: 0 0 10px rgba(105, 184, 232, .8); animation: pulse 1s ease infinite; }
    .run-state[data-phase="complete"] i { background: var(--green); box-shadow: 0 0 10px rgba(83, 207, 145, .65); }
    .canvas { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #071019; }
    .canvas-head { position: absolute; z-index: 16; top: 0; right: 0; left: 0; display: flex; align-items: center; justify-content: space-between; min-height: 46px; padding: 0 13px; border-bottom: 1px solid var(--line); background: rgba(7, 16, 25, .9); backdrop-filter: blur(12px); }
    .canvas-title { display: flex; align-items: baseline; min-width: 0; gap: 9px; }
    .canvas-title strong { font-size: 12px; font-weight: 650; }
    .canvas-title span { overflow: hidden; color: var(--faint); font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
    .scan-meta { color: var(--faint); font: 10px/1 var(--mono); }
    .scan-meta b { color: var(--blue); font-weight: 600; }
    .viewport { position: absolute; inset: 46px 0 0; overflow: hidden; cursor: grab; touch-action: none; background-color: #071019; background-image: linear-gradient(rgba(126, 165, 183, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(126, 165, 183, .07) 1px, transparent 1px), linear-gradient(rgba(126, 165, 183, .025) 1px, transparent 1px), linear-gradient(90deg, rgba(126, 165, 183, .025) 1px, transparent 1px); background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px; }
    .viewport.is-panning { cursor: grabbing; }
    .world { position: absolute; top: 0; left: 0; width: 1200px; height: 720px; transform-origin: 0 0; will-change: transform; }
    .edges { position: absolute; inset: 0; width: 1200px; height: 720px; overflow: visible; pointer-events: none; }
    .edge { fill: none; stroke: rgba(112, 174, 205, .16); stroke-width: 1.5; vector-effect: non-scaling-stroke; transition: stroke .2s ease; }
    .edge.is-active { stroke: var(--blue); stroke-dasharray: 6 5; animation: dash 1.4s linear infinite; }
    .edge.is-done { stroke: rgba(83, 207, 145, .55); }
    .scan-core { position: absolute; z-index: 4; left: 480px; top: 250px; width: 240px; min-height: 180px; border: 1px solid var(--line-strong); background: rgba(9, 18, 25, .96); box-shadow: 0 20px 55px rgba(0, 0, 0, .34); }
    .scan-core::before { position: absolute; inset: -14px; border: 1px solid rgba(105, 184, 232, .08); pointer-events: none; content: ""; }
    .scan-core.is-running::before { border-color: rgba(105, 184, 232, .26); animation: coreRing 1.4s ease infinite; }
    .core-head { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; border-bottom: 1px solid var(--line); background: rgba(20, 36, 47, .66); }
    .core-icon { display: grid; place-items: center; width: 18px; height: 18px; border: 1px solid rgba(105, 184, 232, .4); color: var(--blue); font: 700 9px/1 var(--mono); }
    .core-head strong { flex: 1; font-size: 12px; }
    .core-phase { color: var(--faint); font: 9px/1 var(--mono); }
    .core-body { padding: 13px; }
    .scan-path { height: 36px; margin: 0 0 13px; overflow: hidden; color: #cbd8dc; font: 10px/1.55 var(--mono); overflow-wrap: anywhere; }
    .progress-track { height: 3px; overflow: hidden; background: rgba(170, 201, 215, .1); }
    .progress-fill { width: 0; height: 100%; background: var(--blue); transition: width .24s ease; }
    .scan-count { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; color: var(--faint); font: 9px/1 var(--mono); }
    .scan-count b { color: var(--ink); font-size: 11px; font-weight: 600; }
    .scan-primary { width: 100%; min-height: 36px; margin-top: 13px; border: 1px solid rgba(83, 207, 145, .56); color: #06130d; background: var(--green); font-size: 12px; font-weight: 700; cursor: pointer; }
    .scan-primary:hover { filter: brightness(1.07); }
    .scan-core.is-running .scan-primary { border-color: rgba(105, 184, 232, .48); color: var(--blue); background: var(--blue-soft); }
    .module { position: absolute; z-index: 3; width: 245px; min-height: 124px; border: 1px solid rgba(145, 181, 198, .24); color: var(--ink); background: rgba(13, 24, 33, .96); box-shadow: 0 16px 38px rgba(0, 0, 0, .28); opacity: .18; transform: translateY(6px); pointer-events: none; transition: opacity .24s ease, transform .24s ease, border-color .2s ease, box-shadow .2s ease; }
    .module.is-discovered { opacity: 1; transform: none; pointer-events: auto; cursor: pointer; }
    .module.is-active { border-color: rgba(105, 184, 232, .72); box-shadow: 0 18px 44px rgba(0, 0, 0, .34), 0 0 0 1px rgba(105, 184, 232, .12); }
    .module.is-complete { border-color: rgba(83, 207, 145, .42); }
    .module.is-selected { box-shadow: 0 0 0 2px rgba(105, 184, 232, .42), 0 18px 44px rgba(0, 0, 0, .34); }
    .module[data-module="projects"] { left: 95px; top: 90px; }
    .module[data-module="design"] { left: 860px; top: 90px; }
    .module[data-module="knowledge"] { left: 95px; top: 500px; }
    .module[data-module="media"] { left: 860px; top: 500px; }
    .module[data-module="custom"] { left: 478px; top: 520px; }
    .module-head { display: flex; align-items: center; gap: 8px; min-height: 35px; padding: 0 10px; border-bottom: 1px solid var(--line); background: rgba(20, 36, 47, .62); }
    .module-icon { display: grid; place-items: center; width: 18px; height: 18px; border: 1px solid rgba(105, 184, 232, .32); color: var(--blue); font: 700 9px/1 var(--mono); }
    .module-title { flex: 1; font-size: 12px; font-weight: 650; }
    .module-total { color: var(--faint); font: 9px/1 var(--mono); }
    .module-body { padding: 10px; }
    .module-latest { min-height: 34px; margin: 0; color: #c5d2d7; font: 10px/1.55 var(--mono); overflow-wrap: anywhere; }
    .module-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; color: var(--faint); font-size: 9.5px; }
    .module-state { display: inline-flex; align-items: center; gap: 5px; }
    .module-state::before { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); content: ""; }
    .module.is-active .module-state::before { background: var(--blue); box-shadow: 0 0 8px rgba(105, 184, 232, .7); }
    .module.is-complete .module-state::before { background: var(--green); }
    .module-open { color: #7fb7d3; font: 9px/1 var(--mono); }
    .drawer { position: absolute; z-index: 20; top: 58px; right: 12px; bottom: 58px; display: grid; grid-template-rows: auto auto minmax(0, 1fr); width: min(310px, calc(100% - 24px)); border: 1px solid var(--line-strong); background: rgba(8, 16, 22, .95); box-shadow: 0 20px 50px rgba(0, 0, 0, .38); backdrop-filter: blur(14px); opacity: 0; transform: translateX(10px); pointer-events: none; transition: opacity .18s ease, transform .18s ease; }
    .drawer.is-open { opacity: 1; transform: none; pointer-events: auto; }
    .drawer-head { display: flex; align-items: center; gap: 9px; min-height: 43px; padding: 0 10px; border-bottom: 1px solid var(--line); }
    .drawer-head strong { flex: 1; font-size: 12px; }
    .drawer-count { color: var(--green); font: 9px/1 var(--mono); }
    .drawer-close { width: 28px; height: 28px; border: 0; color: var(--faint); background: transparent; cursor: pointer; }
    .drawer-summary { padding: 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10.5px; }
    .file-list { min-height: 0; margin: 0; padding: 8px 10px 14px; overflow: auto; list-style: none; scrollbar-width: thin; scrollbar-color: rgba(132, 160, 173, .28) transparent; }
    .file-item { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .file-index { color: var(--faint); font: 9px/1.5 var(--mono); }
    .file-name { display: block; overflow: hidden; color: #d7e2e5; font: 10px/1.5 var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .file-path { display: block; margin-top: 2px; color: var(--faint); font: 9px/1.45 var(--mono); overflow-wrap: anywhere; }
    .file-empty { padding: 16px 0; color: var(--faint); font-size: 11px; text-align: center; }
    .toolbar { position: absolute; z-index: 17; right: 12px; bottom: 12px; display: flex; align-items: center; border: 1px solid var(--line-strong); background: rgba(8, 16, 22, .9); backdrop-filter: blur(12px); }
    .control { min-width: 34px; height: 34px; border: 0; border-right: 1px solid var(--line); color: var(--muted); background: transparent; cursor: pointer; }
    .control:last-child { border-right: 0; }
    .control:hover { color: var(--ink); background: rgba(105, 184, 232, .09); }
    .zoom-label { min-width: 46px; color: var(--faint); font: 9px/1 var(--mono); text-align: center; }
    .reset-scan { position: absolute; z-index: 17; left: 12px; bottom: 12px; min-height: 34px; padding: 0 12px; border: 1px solid var(--line-strong); color: var(--muted); background: rgba(8, 16, 22, .9); cursor: pointer; }
    .reset-scan:hover { color: var(--ink); border-color: rgba(105, 184, 232, .5); }
    .add-module { position: absolute; z-index: 17; left: 105px; bottom: 12px; min-height: 34px; padding: 0 12px; border: 1px solid rgba(105, 184, 232, .4); color: var(--blue); background: rgba(8, 16, 22, .9); cursor: pointer; }
    .add-module:hover:not(:disabled) { background: var(--blue-soft); }
    .add-module:disabled { border-color: var(--line); color: var(--faint); cursor: default; }
    .live { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes coreRing { 50% { inset: -22px; opacity: .25; } }
    @media (max-width: 700px) {
      html, body { overflow: auto; }
      .app { height: auto; min-height: 900px; grid-template-rows: 44px 856px; }
      .brand span, .run-state span { display: none; }
      .canvas-head { min-height: 44px; }
      .viewport { top: 44px; }
      .drawer { top: auto; right: 8px; bottom: 54px; left: 8px; width: auto; height: 245px; }
      .toolbar { right: 8px; bottom: 8px; }
      .reset-scan { left: 8px; bottom: 8px; }
      .add-module { left: 101px; bottom: 8px; }
      .canvas-title span { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">N</span><strong>NEXTSTEP</strong><span>渐进资产扫描</span></div>
      <div class="run-state" id="run-state" data-phase="idle"><i></i><span id="run-label">扫描器就绪</span></div>
    </header>
    <section class="canvas" aria-label="资产扫描画布">
      <header class="canvas-head">
        <div class="canvas-title"><strong>本地资产地图</strong><span>逐项发现，不一次性伪造结果</span></div>
        <div class="scan-meta"><b id="found-count">0</b> / <span id="total-count">16</span> 文件</div>
      </header>
      <div class="viewport" id="viewport">
        <div class="world" id="world">
          <svg class="edges" id="module-edges" viewBox="0 0 1200 720" aria-hidden="true">
            <path class="edge" data-edge="projects" d="M480 320 C415 320 405 152 340 152"></path>
            <path class="edge" data-edge="design" d="M720 320 C785 320 795 152 860 152"></path>
            <path class="edge" data-edge="knowledge" d="M480 370 C415 370 405 562 340 562"></path>
            <path class="edge" data-edge="media" d="M720 370 C785 370 795 562 860 562"></path>
          </svg>
          <article class="scan-core" id="scan-core">
            <header class="core-head"><span class="core-icon">S</span><strong>扫描入口</strong><span class="core-phase" id="core-phase">READY</span></header>
            <div class="core-body">
              <p class="scan-path" id="scan-path">等待扫描 D:\AIoutput 与 D:\codestudio 的演示快照。</p>
              <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
              <div class="scan-count"><span>扫描进度</span><b id="progress-text">0%</b></div>
              <button class="scan-primary" id="scan-button" type="button">开始渐进扫描</button>
            </div>
          </article>
          <article class="module" data-module="projects" tabindex="0" role="button" aria-label="打开项目模块文件清单"><header class="module-head"><span class="module-icon">PR</span><strong class="module-title">项目</strong><span class="module-total" data-count>0 文件</span></header><div class="module-body"><p class="module-latest" data-latest>等待发现项目文件</p><div class="module-foot"><span class="module-state" data-state>未扫描</span><span class="module-open">查看清单 →</span></div></div></article>
          <article class="module" data-module="design" tabindex="0" role="button" aria-label="打开设计模块文件清单"><header class="module-head"><span class="module-icon">UI</span><strong class="module-title">设计</strong><span class="module-total" data-count>0 文件</span></header><div class="module-body"><p class="module-latest" data-latest>等待发现设计资产</p><div class="module-foot"><span class="module-state" data-state>未扫描</span><span class="module-open">查看清单 →</span></div></div></article>
          <article class="module" data-module="knowledge" tabindex="0" role="button" aria-label="打开知识模块文件清单"><header class="module-head"><span class="module-icon">KB</span><strong class="module-title">知识</strong><span class="module-total" data-count>0 文件</span></header><div class="module-body"><p class="module-latest" data-latest>等待发现知识文档</p><div class="module-foot"><span class="module-state" data-state>未扫描</span><span class="module-open">查看清单 →</span></div></div></article>
          <article class="module" data-module="media" tabindex="0" role="button" aria-label="打开媒体模块文件清单"><header class="module-head"><span class="module-icon">AV</span><strong class="module-title">媒体</strong><span class="module-total" data-count>0 文件</span></header><div class="module-body"><p class="module-latest" data-latest>等待发现媒体文件</p><div class="module-foot"><span class="module-state" data-state>未扫描</span><span class="module-open">查看清单 →</span></div></div></article>
        </div>
      </div>
      <aside class="drawer" id="drawer" aria-hidden="true" aria-label="模块文件清单"><header class="drawer-head"><strong id="drawer-title">模块清单</strong><span class="drawer-count" id="drawer-count">0 FILES</span><button class="drawer-close" id="drawer-close" type="button" aria-label="关闭清单">×</button></header><div class="drawer-summary" id="drawer-summary">扫描过程中会实时补充文件。</div><ol class="file-list" id="file-list"></ol></aside>
      <button class="reset-scan" id="reset-scan" type="button">重置扫描</button>
      <button class="add-module" id="add-module" type="button">新增模块</button>
      <div class="toolbar" aria-label="画布控制"><button class="control" id="zoom-out" type="button" aria-label="缩小">−</button><span class="zoom-label" id="zoom-label">100%</span><button class="control" id="zoom-in" type="button" aria-label="放大">＋</button><button class="control" id="fit-view" type="button" aria-label="适应画布">⌂</button></div>
      <p class="live" id="live" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    (function () {
      'use strict';
      var catalog = [
        { module: 'projects', name: 'next-step-eliminator/package.json', root: 'D:\\codestudio' },
        { module: 'knowledge', name: '周级知识提炼.md', root: 'D:\\AIoutput' },
        { module: 'design', name: 'canvas-workbench.fig', root: 'D:\\AIoutput\\design' },
        { module: 'media', name: 'release-walkthrough.mp4', root: 'E:\\media' },
        { module: 'projects', name: 'personal-site/src/app/page.tsx', root: 'D:\\AIoutput' },
        { module: 'design', name: 'mobile-layout-notes.png', root: 'D:\\AIoutput\\design' },
        { module: 'knowledge', name: 'PROJECT_RULES.md', root: 'D:\\codestudio\\next-step-eliminator' },
        { module: 'projects', name: 'CanvasWorkbench.tsx', root: 'D:\\codestudio\\next-step-eliminator' },
        { module: 'media', name: 'node-stream-preview.webm', root: 'D:\\AIoutput\\previews' },
        { module: 'knowledge', name: 'Bug 档案.md', root: '%APPDATA%\\next-step' },
        { module: 'design', name: 'node-states.svg', root: 'D:\\AIoutput\\design' },
        { module: 'media', name: 'interface-reference.jpg', root: 'E:\\references' },
        { module: 'projects', name: 'demo-sync.html', root: 'D:\\codestudio\\next-step-eliminator' },
        { module: 'knowledge', name: 'DESIGN_PHILOSOPHY.md', root: 'D:\\codestudio\\next-step-eliminator\\docs' },
        { module: 'design', name: 'canvas-spacing.tokens.json', root: 'D:\\AIoutput\\design' },
        { module: 'media', name: 'agent-confirmation.wav', root: 'D:\\AIoutput\\audio' }
      ];
      var moduleNames = { projects: '项目', design: '设计', knowledge: '知识', media: '媒体' };
      var state = { phase: 'idle', index: 0, active: '', selected: '', files: emptyBuckets() };
      var timer = 0;
      var token = 0;
      var view = { x: 0, y: 0, scale: 1 };
      var gesture = null;
      var viewport = document.getElementById('viewport');
      var world = document.getElementById('world');
      var scanCore = document.getElementById('scan-core');
      var scanButton = document.getElementById('scan-button');
      var resetButton = document.getElementById('reset-scan');
      var addModuleButton = document.getElementById('add-module');
      var runState = document.getElementById('run-state');
      var runLabel = document.getElementById('run-label');
      var corePhase = document.getElementById('core-phase');
      var scanPath = document.getElementById('scan-path');
      var progressFill = document.getElementById('progress-fill');
      var progressText = document.getElementById('progress-text');
      var foundCount = document.getElementById('found-count');
      var drawer = document.getElementById('drawer');
      var drawerTitle = document.getElementById('drawer-title');
      var drawerCount = document.getElementById('drawer-count');
      var drawerSummary = document.getElementById('drawer-summary');
      var fileList = document.getElementById('file-list');
      var zoomLabel = document.getElementById('zoom-label');
      var live = document.getElementById('live');
      var modules = Array.prototype.slice.call(document.querySelectorAll('.module'));
      var edges = Array.prototype.slice.call(document.querySelectorAll('.edge'));
      function emptyBuckets() { return { projects: [], design: [], knowledge: [], media: [] }; }
      function announce(message) { live.textContent = ''; requestAnimationFrame(function () { live.textContent = message; }); }
      function renderDrawer() {
        if (!state.selected) { drawer.classList.remove('is-open'); drawer.setAttribute('aria-hidden', 'true'); return; }
        var files = state.files[state.selected];
        drawer.classList.add('is-open');
        drawer.setAttribute('aria-hidden', 'false');
        drawerTitle.textContent = moduleNames[state.selected] + '模块';
        drawerCount.textContent = files.length + ' FILES';
        drawerSummary.textContent = state.phase === 'complete' ? '扫描完成，以下为本轮归类结果。' : '扫描过程中会实时补充文件。';
        fileList.textContent = '';
        if (!files.length) { var empty = document.createElement('li'); empty.className = 'file-empty'; empty.textContent = '尚未发现文件'; fileList.appendChild(empty); return; }
        files.forEach(function (file, index) {
          var item = document.createElement('li');
          item.className = 'file-item';
          var number = document.createElement('span');
          number.className = 'file-index';
          number.textContent = String(index + 1).padStart(2, '0');
          var copy = document.createElement('span');
          var name = document.createElement('strong');
          name.className = 'file-name';
          name.textContent = file.name;
          var path = document.createElement('span');
          path.className = 'file-path';
          path.textContent = file.root;
          copy.appendChild(name);
          copy.appendChild(path);
          item.appendChild(number);
          item.appendChild(copy);
          fileList.appendChild(item);
        });
      }
      function render() {
        var progress = Math.round(state.index / catalog.length * 100);
        runState.dataset.phase = state.phase;
        scanCore.classList.toggle('is-running', state.phase === 'scanning');
        foundCount.textContent = String(state.index);
        progressFill.style.width = progress + '%';
        progressText.textContent = progress + '%';
        if (state.phase === 'idle') { runLabel.textContent = '扫描器就绪'; corePhase.textContent = 'READY'; scanPath.textContent = '等待扫描 D:\\AIoutput 与 D:\\codestudio 的演示快照。'; scanButton.textContent = '开始渐进扫描'; }
        else if (state.phase === 'scanning') { runLabel.textContent = '正在渐进扫描'; corePhase.textContent = 'SCANNING'; scanButton.textContent = '暂停扫描'; }
        else if (state.phase === 'paused') { runLabel.textContent = '扫描已暂停'; corePhase.textContent = 'PAUSED'; scanButton.textContent = '继续扫描'; }
        else { runLabel.textContent = '扫描完成'; corePhase.textContent = 'COMPLETE'; scanPath.textContent = '16 个文件已归入 4 个模块，可打开节点检查清单。'; scanButton.textContent = '再次扫描'; }
        modules.forEach(function (node) {
          var id = node.dataset.module;
          var files = state.files[id];
          var manual = node.dataset.manual === 'true';
          var discovered = files.length > 0 || manual;
          var finished = !manual && (state.phase === 'complete' || (state.index > 0 && !catalog.slice(state.index).some(function (item) { return item.module === id; })));
          node.classList.toggle('is-discovered', discovered);
          node.classList.toggle('is-active', state.phase === 'scanning' && state.active === id);
          node.classList.toggle('is-complete', discovered && finished);
          node.classList.toggle('is-selected', state.selected === id);
          node.querySelector('[data-count]').textContent = files.length + ' 文件';
          node.querySelector('[data-latest]').textContent = files.length ? files[files.length - 1].name : manual ? '空模块，等待手动归类' : '等待发现' + moduleNames[id] + '文件';
          node.querySelector('[data-state]').textContent = manual && !files.length ? '新模块' : !discovered ? '未扫描' : state.active === id && state.phase === 'scanning' ? '正在归类' : finished ? '已归类' : '等待追加';
        });
        edges.forEach(function (edge) {
          var id = edge.dataset.edge;
          var hasFiles = state.files[id].length > 0;
          var hasRemaining = catalog.slice(state.index).some(function (item) { return item.module === id; });
          edge.classList.toggle('is-active', state.phase === 'scanning' && state.active === id);
          edge.classList.toggle('is-done', hasFiles && !hasRemaining);
        });
        renderDrawer();
      }
      function schedule(id) {
        clearTimeout(timer);
        timer = setTimeout(function () {
          if (id !== token || state.phase !== 'scanning') return;
          var item = catalog[state.index];
          state.active = item.module;
          state.files[item.module].push(item);
          state.index += 1;
          scanPath.textContent = item.root + '\\' + item.name;
          render();
          if (state.index >= catalog.length) { state.phase = 'complete'; state.active = ''; render(); announce('扫描完成，16 个文件已归入 4 个模块。'); return; }
          schedule(id);
        }, 380);
      }
      function startOrPause() {
        if (state.phase === 'scanning') { token += 1; clearTimeout(timer); state.phase = 'paused'; render(); announce('扫描已暂停。'); return; }
        if (state.phase === 'complete') resetScan(false);
        state.phase = 'scanning';
        token += 1;
        render();
        announce(state.index ? '继续渐进扫描。' : '开始渐进扫描。');
        schedule(token);
      }
      function resetScan(shouldAnnounce) {
        token += 1;
        clearTimeout(timer);
        var customNode = document.querySelector('.module[data-module="custom"]');
        var customEdge = document.querySelector('.edge[data-edge="custom"]');
        if (customNode) customNode.remove();
        if (customEdge) customEdge.remove();
        modules = modules.filter(function (node) { return node.dataset.module !== 'custom'; });
        edges = edges.filter(function (edge) { return edge.dataset.edge !== 'custom'; });
        delete moduleNames.custom;
        addModuleButton.disabled = false;
        addModuleButton.textContent = '新增模块';
        state = { phase: 'idle', index: 0, active: '', selected: '', files: emptyBuckets() };
        render();
        if (shouldAnnounce !== false) announce('扫描状态与模块清单已重置。');
      }
      function openModule(node) { if (!node.classList.contains('is-discovered')) return; state.selected = node.dataset.module; render(); announce('已打开' + moduleNames[state.selected] + '模块文件清单。'); }
      function bindModule(node) {
        node.addEventListener('click', function () { openModule(node); });
        node.addEventListener('keydown', function (event) { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openModule(node); } });
      }
      function addModule() {
        if (state.files.custom) return;
        state.files.custom = [];
        moduleNames.custom = '待整理';
        var node = document.createElement('article');
        node.className = 'module';
        node.dataset.module = 'custom';
        node.dataset.manual = 'true';
        node.tabIndex = 0;
        node.setAttribute('role', 'button');
        node.setAttribute('aria-label', '打开待整理模块文件清单');
        node.innerHTML = '<header class="module-head"><span class="module-icon">＋</span><strong class="module-title">待整理</strong><span class="module-total" data-count>0 文件</span></header><div class="module-body"><p class="module-latest" data-latest>空模块，等待手动归类</p><div class="module-foot"><span class="module-state" data-state>新模块</span><span class="module-open">查看清单 →</span></div></div>';
        world.appendChild(node);
        modules.push(node);
        bindModule(node);
        var edge = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        edge.setAttribute('class', 'edge');
        edge.dataset.edge = 'custom';
        edge.setAttribute('d', 'M600 430 C600 465 600 485 600 520');
        document.getElementById('module-edges').appendChild(edge);
        edges.push(edge);
        state.selected = 'custom';
        addModuleButton.disabled = true;
        addModuleButton.textContent = '模块已添加';
        render();
        announce('已新增待整理模块，可打开查看空清单。');
      }
      function applyView() {
        world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.scale + ')';
        zoomLabel.textContent = Math.round(view.scale * 100) + '%';
        var major = 80 * view.scale;
        var minor = 16 * view.scale;
        viewport.style.backgroundPosition = view.x + 'px ' + view.y + 'px';
        viewport.style.backgroundSize = major + 'px ' + major + 'px, ' + major + 'px ' + major + 'px, ' + minor + 'px ' + minor + 'px, ' + minor + 'px ' + minor + 'px';
      }
      function setView(x, y, scale) { view.x = x; view.y = y; view.scale = Math.max(.45, Math.min(1.55, scale)); applyView(); }
      function fitView() { var rect = viewport.getBoundingClientRect(); var scale = Math.min(1, Math.max(.45, Math.min((rect.width - 30) / 1200, (rect.height - 30) / 720))); setView((rect.width - 1200 * scale) / 2, (rect.height - 720 * scale) / 2, scale); }
      function zoomAt(clientX, clientY, factor) { var rect = viewport.getBoundingClientRect(); var px = clientX - rect.left; var py = clientY - rect.top; var worldX = (px - view.x) / view.scale; var worldY = (py - view.y) / view.scale; var next = Math.max(.45, Math.min(1.55, view.scale * factor)); setView(px - worldX * next, py - worldY * next, next); }
      scanButton.addEventListener('click', startOrPause);
      resetButton.addEventListener('click', function () { resetScan(true); });
      addModuleButton.addEventListener('click', addModule);
      document.getElementById('drawer-close').addEventListener('click', function () { state.selected = ''; render(); });
      modules.forEach(bindModule);
      viewport.addEventListener('pointerdown', function (event) {
        if (event.button !== 0 || event.target.closest('.module, .scan-core')) return;
        gesture = { x: event.clientX, y: event.clientY, startX: view.x, startY: view.y };
        viewport.classList.add('is-panning');
        viewport.setPointerCapture(event.pointerId);
      });
      viewport.addEventListener('pointermove', function (event) { if (!gesture) return; setView(gesture.startX + event.clientX - gesture.x, gesture.startY + event.clientY - gesture.y, view.scale); });
      viewport.addEventListener('pointerup', function () { gesture = null; viewport.classList.remove('is-panning'); });
      viewport.addEventListener('pointercancel', function () { gesture = null; viewport.classList.remove('is-panning'); });
      viewport.addEventListener('wheel', function (event) { event.preventDefault(); zoomAt(event.clientX, event.clientY, event.deltaY < 0 ? 1.1 : .9); }, { passive: false });
      document.getElementById('zoom-in').addEventListener('click', function () { var rect = viewport.getBoundingClientRect(); zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.12); });
      document.getElementById('zoom-out').addEventListener('click', function () { var rect = viewport.getBoundingClientRect(); zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, .88); });
      document.getElementById('fit-view').addEventListener('click', fitView);
      addEventListener('resize', fitView);
      document.getElementById('total-count').textContent = String(catalog.length);
      render();
      requestAnimationFrame(fitView);
    }());
  </script>
</body>
