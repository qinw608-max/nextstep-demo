<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NextStep｜节点 Agent</title>
  <style>
    :root{--bg:#05090d;--panel:#091119;--panel-2:#0c1721;--surface:#101c26;--ink:#edf5f7;--muted:#8ea0aa;--faint:#5c6d77;--line:rgba(170,201,215,.17);--line-strong:rgba(170,201,215,.31);--blue:#69b8e8;--amber:#e4aa5b;--green:#53cf91;--red:#ef806f;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;--sans:Inter,"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}body{color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button,textarea,input{font:inherit;color:inherit}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .app{display:grid;grid-template-rows:46px minmax(0,1fr);width:100%;height:100%;background:radial-gradient(circle at 68% 8%,rgba(39,108,144,.08),transparent 35%),var(--bg)}.topbar{position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;min-width:0;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(5,9,13,.94)}.brand,.status{display:flex;align-items:center;min-width:0;gap:9px}.brand-mark{display:grid;place-items:center;width:22px;height:22px;border:1px solid rgba(83,207,145,.48);color:var(--green);font:700 10px/1 var(--mono)}.brand strong{font:600 12px/1 var(--mono);letter-spacing:.08em}.brand span{overflow:hidden;color:var(--faint);font-size:12px;text-overflow:ellipsis;white-space:nowrap}.status{color:var(--muted);font:10px/1 var(--mono);white-space:nowrap}.status i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(83,207,145,.75)}
    .workbench{display:grid;grid-template-columns:minmax(280px,31%) minmax(0,1fr);min-height:0}.agent-pane{position:relative;z-index:5;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;min-height:0;border-right:1px solid var(--line-strong);background:rgba(8,15,21,.97)}.pane-head{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 14px;border-bottom:1px solid var(--line)}.pane-head strong{display:block;font-size:13px;font-weight:650}.pane-head small{display:block;margin-top:2px;color:var(--faint);font-size:10.5px}.avatar{display:grid;place-items:center;width:28px;height:28px;border:1px solid rgba(105,184,232,.36);color:var(--blue);background:rgba(76,164,220,.13);font:700 10px/1 var(--mono)}
    .transcript{overflow:auto;padding:14px;scrollbar-width:thin;scrollbar-color:rgba(132,160,173,.28) transparent}.message{margin:0 0 14px}.message-meta{display:flex;align-items:center;gap:7px;margin-bottom:5px;color:var(--faint);font:9px/1 var(--mono)}.message-meta b{color:var(--blue);font-weight:600}.message.user .message-meta b{color:var(--amber)}.bubble{padding:9px 10px;border:1px solid var(--line);color:#dce7e9;background:rgba(14,25,34,.76);font-size:11.5px;line-height:1.6}.message.user .bubble{border-color:rgba(228,170,91,.24);background:rgba(228,170,91,.07)}.trace{display:block;margin-top:6px;color:var(--faint);font:9px/1.4 var(--mono)}
    .composer{padding:11px 12px 12px;border-top:1px solid var(--line);background:rgba(6,11,16,.9)}.context{margin-bottom:8px;padding:8px 9px;border-left:2px solid var(--blue);color:#c9d6da;background:rgba(105,184,232,.055);font-size:10.5px}.context strong{display:block;margin-bottom:2px;color:var(--ink);font-size:11px}.context span{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2}.ask-row{display:grid;grid-template-columns:1fr auto;gap:6px}.ask-row textarea{min-width:0;min-height:58px;resize:none;padding:8px;border:1px solid var(--line-strong);color:var(--ink);background:rgba(3,8,12,.68);font-size:11px;line-height:1.45}.primary{min-width:72px;border:1px solid rgba(83,207,145,.54);color:#06130d;background:var(--green);font-size:11px;font-weight:700;cursor:pointer}.primary:hover:not(:disabled){filter:brightness(1.08)}.primary:disabled{border-color:var(--line);color:var(--faint);background:rgba(116,135,144,.08);cursor:default}.new-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-top:7px}.new-row input{min-width:0;height:32px;padding:0 8px;border:1px solid var(--line);background:rgba(3,8,12,.5);font-size:10.5px}.secondary{min-height:32px;padding:0 9px;border:1px solid rgba(105,184,232,.34);color:#b9dced;background:rgba(105,184,232,.08);font-size:10.5px;cursor:pointer}.secondary:hover{background:rgba(105,184,232,.15)}
    .canvas-pane{position:relative;min-width:0;min-height:0;overflow:hidden;background:#071019}.canvas-pane::after{position:absolute;inset:0;z-index:1;pointer-events:none;content:"";box-shadow:inset 0 0 100px rgba(0,0,0,.38)}.canvas-head{position:absolute;z-index:15;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;min-height:46px;padding:0 12px;border-bottom:1px solid var(--line);background:rgba(7,16,25,.9);backdrop-filter:blur(12px)}.canvas-head strong{font-size:12px;font-weight:600}.canvas-head span{display:block;color:var(--faint);font-size:10px}.head-actions{display:flex;align-items:center;gap:7px}.reset{height:30px;padding:0 9px;border:1px solid var(--line);color:var(--muted);background:transparent;font-size:10px;cursor:pointer}.reset:hover{color:var(--ink);background:rgba(105,184,232,.08)}
    .viewport{position:absolute;z-index:2;inset:46px 0 0;overflow:hidden;cursor:grab;touch-action:none;background-color:#071019;background-image:linear-gradient(rgba(126,165,183,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(126,165,183,.07) 1px,transparent 1px),linear-gradient(rgba(126,165,183,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(126,165,183,.025) 1px,transparent 1px);background-size:80px 80px,80px 80px,16px 16px,16px 16px}.viewport.is-panning{cursor:grabbing}.world{position:absolute;top:0;left:0;width:1800px;height:1100px;transform-origin:0 0;will-change:transform}.edges{position:absolute;inset:0;width:1800px;height:1100px;overflow:visible;pointer-events:none}.edge{fill:none;stroke:rgba(105,184,232,.43);stroke-width:1.5;vector-effect:non-scaling-stroke}.edge.is-new{stroke:var(--green);stroke-dasharray:6 5;animation:dash 2.3s linear infinite}
    .node{position:absolute;z-index:3;width:258px;border:1px solid rgba(145,181,198,.32);background:rgba(13,24,33,.97);box-shadow:0 16px 34px rgba(0,0,0,.3);transition:border-color .16s,box-shadow .16s}.node:hover,.node.is-selected{border-color:rgba(105,184,232,.72);box-shadow:0 0 0 1px rgba(105,184,232,.12),0 18px 40px rgba(0,0,0,.4)}.node.is-written{border-color:rgba(83,207,145,.58)}.node.is-flashing{animation:flash .8s ease}.node-head{display:flex;align-items:center;gap:8px;min-height:35px;padding:0 10px;border-bottom:1px solid var(--line);background:rgba(20,36,47,.68);cursor:move;user-select:none}.node-icon{display:grid;place-items:center;width:17px;height:17px;border:1px solid rgba(105,184,232,.34);color:var(--blue);font:700 9px/1 var(--mono)}.node-title{flex:1;min-width:0;overflow:hidden;font-size:12px;font-weight:650;text-overflow:ellipsis;white-space:nowrap}.node-source{padding:3px 5px;border:1px solid rgba(105,184,232,.22);color:var(--muted);font:9px/1 var(--mono)}.node-body{padding:10px}.node-copy{margin:0;color:#cbd8dc;font-size:11.5px;line-height:1.58;cursor:text;user-select:text}.node-status{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;color:var(--faint);font-size:9.5px}.state{display:inline-flex;align-items:center;gap:5px}.state::before{width:6px;height:6px;border-radius:50%;background:var(--blue);content:""}.node.is-written .state::before{background:var(--green)}.writeback{margin-top:9px;padding:8px;border-top:1px solid rgba(83,207,145,.2);color:#bfe0d0;background:rgba(83,207,145,.055);font-size:10.5px;line-height:1.55}.writeback b{display:block;margin-bottom:3px;color:var(--green);font:9px/1 var(--mono)}.port{position:absolute;z-index:5;top:50%;width:10px;height:10px;margin-top:-5px;border:2px solid #08121a;border-radius:50%;background:#6ea9c7}.port.in{left:-6px}.port.out{right:-6px}
    .controls{position:absolute;z-index:16;right:12px;bottom:12px;display:flex;align-items:center;border:1px solid var(--line-strong);background:rgba(8,16,22,.9);backdrop-filter:blur(12px)}.control{min-width:34px;height:34px;border:0;border-right:1px solid var(--line);color:var(--muted);background:transparent;cursor:pointer}.control:last-child{border-right:0}.control:hover{color:var(--ink);background:rgba(105,184,232,.09)}.zoom-label{min-width:46px;color:var(--faint);font:9px/1 var(--mono);text-align:center}.tip{position:absolute;z-index:10;left:12px;bottom:12px;margin:0;color:rgba(143,164,174,.72);font-size:10px;pointer-events:none}.toast{position:absolute;z-index:25;left:50%;bottom:58px;padding:8px 11px;border:1px solid rgba(83,207,145,.3);color:#c9ecda;background:rgba(8,22,16,.94);font-size:10.5px;opacity:0;transform:translate(-50%,8px);pointer-events:none;transition:.18s}.toast.is-visible{opacity:1;transform:translate(-50%,0)}
    @keyframes dash{to{stroke-dashoffset:-22}}@keyframes flash{50%{box-shadow:0 0 0 3px rgba(83,207,145,.18),0 20px 44px rgba(0,0,0,.42)}}@media(max-width:820px){.workbench{grid-template-columns:minmax(260px,36%) minmax(0,1fr)}.ask-row{grid-template-columns:1fr}.primary{min-height:34px}.new-row{grid-template-columns:1fr}.secondary{min-height:34px}}@media(max-width:700px){html,body{overflow:auto}.app{height:auto;min-height:980px;grid-template-rows:44px auto}.workbench{grid-template-columns:1fr;grid-template-rows:390px 570px}.agent-pane{border-right:0;border-bottom:1px solid var(--line-strong)}.transcript{padding:10px}.composer{padding:9px 10px}.ask-row{grid-template-columns:1fr 72px}.new-row{grid-template-columns:1fr auto}.canvas-pane{min-height:570px}.brand span,.status span{display:none}.tip{display:none}}@media(max-width:430px){.ask-row,.new-row{grid-template-columns:1fr}.workbench{grid-template-rows:430px 570px}.status{display:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="brand-mark">AI</span><strong>NEXTSTEP</strong><span>节点 Agent · 问题与回复留在执行现场</span></div><div class="status"><i></i><span>本地 Agent · 可写回</span></div></header>
    <section class="workbench">
      <aside class="agent-pane" aria-label="节点 Agent">
        <header class="pane-head"><div><strong>执行 Agent</strong><small>先选节点，再针对具体内容发问</small></div><span class="avatar">AI</span></header>
        <div class="transcript" id="transcript" aria-live="polite">
          <article class="message"><div class="message-meta"><b>Agent</b><span>已连接画布</span></div><div class="bubble">我会读取当前节点的标题与正文。回复写回原节点，新动作也会成为画布节点。<span class="trace">上下文：Beta 发布画布</span></div></article>
        </div>
        <footer class="composer">
          <div class="context"><strong id="contextTitle"></strong><span id="contextCopy"></span></div>
          <div class="ask-row"><textarea id="question" aria-label="向当前节点提问" placeholder="例如：这个节点最容易漏掉什么？"></textarea><button class="primary" id="ask" type="button">提问并写回</button></div>
          <div class="new-row"><input id="newTitle" aria-label="新节点标题" placeholder="新节点标题，例如：补充失败恢复"><button class="secondary" id="createNode" type="button">Agent 新建节点</button></div>
        </footer>
      </aside>
      <section class="canvas-pane" aria-label="Agent 执行画布">
        <header class="canvas-head"><div><strong>Beta 发布 / 执行层</strong><span id="canvasMeta">已选中 1 个节点</span></div><div class="head-actions"><button class="reset" id="reset" type="button">重置演示</button></div></header>
        <div class="viewport" id="viewport"><div class="world" id="world"><svg class="edges" id="edges" viewBox="0 0 1800 1100" aria-hidden="true"></svg><div id="nodes"></div></div></div>
        <div class="controls" aria-label="缩放控制"><button class="control" id="zoomOut" type="button">−</button><span class="zoom-label" id="zoomLabel">100%</span><button class="control" id="zoomIn" type="button">＋</button><button class="control" id="fit" type="button">适配</button></div>
        <p class="tip">选中节点正文可带引用提问 · 拖动节点标题移动 · 拖动空白平移 · 滚轮缩放</p><div class="toast" id="toast" role="status" aria-live="polite"></div>
      </section>
    </section>
  </main>
  <script>
    (()=>{
      const seedTasks=[
        {id:'brief',title:'准备 Beta 发布',copy:'完成界面、发布检查和移动端验证，并保留可追溯的执行记录。',x:90,y:210,status:'待拆解',source:'ME',answer:''},
        {id:'check',title:'发布检查',copy:'检查资源路径、空状态、错误恢复入口与主要断点。',x:455,y:115,status:'进行中',source:'AI',answer:''},
        {id:'mobile',title:'移动端回归',copy:'覆盖 390px 与 768px，确认关键控件没有遮挡且触控可用。',x:830,y:325,status:'待确认',source:'AI',answer:''}
      ];
      const seedLinks=[['brief','check'],['check','mobile']];let tasks=[],links=[],active='check',view={x:48,y:34,scale:.86},gesture=null,created=0,toastTimer=0,replyTimer=0,quoteTimer=0;
      const viewport=document.querySelector('#viewport'),world=document.querySelector('#world'),edges=document.querySelector('#edges'),nodes=document.querySelector('#nodes'),transcript=document.querySelector('#transcript'),contextTitle=document.querySelector('#contextTitle'),contextCopy=document.querySelector('#contextCopy'),question=document.querySelector('#question'),ask=document.querySelector('#ask'),newTitle=document.querySelector('#newTitle'),zoomLabel=document.querySelector('#zoomLabel'),canvasMeta=document.querySelector('#canvasMeta'),toast=document.querySelector('#toast');
      function resetData(){tasks=seedTasks.map(item=>({...item}));links=seedLinks.map(item=>[...item]);active='check';created=0}
      function current(){return tasks.find(item=>item.id===active)||tasks[0]}
      function curve(from,to){const bend=Math.max(48,Math.abs(to.x-from.x)*.42);return`M ${from.x} ${from.y} C ${from.x+bend} ${from.y}, ${to.x-bend} ${to.y}, ${to.x} ${to.y}`}
      function renderEdges(){edges.innerHTML=links.map((link,index)=>{const a=nodes.querySelector(`[data-id="${link[0]}"]`),b=nodes.querySelector(`[data-id="${link[1]}"]`);if(!a||!b)return'';const fromTask=tasks.find(item=>item.id===link[0]),toTask=tasks.find(item=>item.id===link[1]),from={x:fromTask.x+a.offsetWidth,y:fromTask.y+a.offsetHeight/2},to={x:toTask.x,y:toTask.y+b.offsetHeight/2};return`<path class="edge${index>=seedLinks.length?' is-new':''}" d="${curve(from,to)}"/>`}).join('')}
      function renderNodes(){nodes.textContent='';tasks.forEach(item=>{const node=document.createElement('article');node.className='node'+(item.id===active?' is-selected':'')+(item.answer?' is-written':'');node.dataset.id=item.id;node.style.transform=`translate(${item.x}px,${item.y}px)`;node.tabIndex=0;node.innerHTML=`<span class="port in"></span><span class="port out"></span><header class="node-head"><span class="node-icon">${item.source==='ME'?'T':'AI'}</span><strong class="node-title">${escapeHtml(item.title)}</strong><span class="node-source">${item.source}</span></header><div class="node-body"><p class="node-copy">${escapeHtml(item.copy)}</p>${item.answer?`<div class="writeback"><b>AGENT 写回</b>${escapeHtml(item.answer)}</div>`:''}<div class="node-status"><span class="state">${item.answer?'已写回':item.status}</span><span>${item.answer?'原节点修订 #01':'点击后提问'}</span></div></div>`;node.addEventListener('click',event=>{const selection=window.getSelection();if(event.target.closest('.node-copy')&&selection&&!selection.isCollapsed&&selection.toString().trim())return;active=item.id;renderAll();question.focus()});node.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();active=item.id;renderAll();question.focus()}});const copy=node.querySelector('.node-copy');copy.addEventListener('mouseup',()=>quoteSelection(item,copy));copy.addEventListener('keyup',event=>{if(event.shiftKey)quoteSelection(item,copy)});node.querySelector('.node-head').addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();event.stopPropagation();active=item.id;gesture={type:'node',id:item.id,startX:event.clientX,startY:event.clientY,x:item.x,y:item.y};renderContext();nodes.querySelectorAll('.node').forEach(el=>el.classList.toggle('is-selected',el.dataset.id===active))});nodes.appendChild(node)});requestAnimationFrame(renderEdges)}
      function renderContext(){const item=current();contextTitle.textContent=item.title;contextCopy.textContent=item.copy;canvasMeta.textContent=`已选中「${item.title}」 · ${tasks.length} 个节点`;if(!question.value||question.dataset.for!==item.id){question.value=`“${item.title}”这个节点最容易漏掉什么？`;question.dataset.for=item.id}}
      function quoteSelection(item,copy){const selection=window.getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return false;const range=selection.getRangeAt(0);if(!copy.contains(range.commonAncestorContainer))return false;const quote=selection.toString().replace(/\s+/g,' ').trim().slice(0,160);if(!quote)return false;active=item.id;renderNodes();renderContext();question.value=`关于“${quote}”，这里还需要补充或验证什么？`;question.dataset.for=item.id;question.dataset.quote=quote;showToast(`已引用「${item.title}」中的选中文字`);requestAnimationFrame(()=>{question.focus();question.setSelectionRange(question.value.length,question.value.length)});return true}
      function captureSelection(){clearTimeout(quoteTimer);quoteTimer=setTimeout(()=>{const selection=window.getSelection();if(!selection||selection.isCollapsed||!selection.rangeCount)return;const common=selection.getRangeAt(0).commonAncestorContainer;const element=common.nodeType===Node.ELEMENT_NODE?common:common.parentElement;const copy=element?.closest?.('.node-copy');const node=copy?.closest('.node');const item=tasks.find(task=>task.id===node?.dataset.id);if(item&&copy)quoteSelection(item,copy)},90)}
      function renderAll(){renderNodes();renderContext()}
      function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
      function appendMessage(role,text,trace){const article=document.createElement('article');article.className='message '+(role==='user'?'user':'');article.innerHTML=`<div class="message-meta"><b>${role==='user'?'我 · 来自画布':'Agent'}</b><span>刚刚</span></div><div class="bubble">${escapeHtml(text)}${trace?`<span class="trace">${escapeHtml(trace)}</span>`:''}</div>`;transcript.appendChild(article);transcript.scrollTop=transcript.scrollHeight;return article}
      function answerFor(item,value){const context=item.title+item.copy+value;if(/失败|恢复|重试/.test(value)||/发布|检查/.test(item.title))return`优先补“失败后如何回来”：显示失败原因、已完成步骤和可重试入口，再检查资源路径与空状态。`;if(/移动|遮挡|触控|390px|768px/.test(context))return`先验证 390px 与 768px 两档：工具栏不能覆盖节点，拖动需保留触控手势，并给输入区留出安全高度。`;return`把「${item.title}」收敛成一个可验收动作：明确输入、完成条件和失败后的下一步。`}
      function askAgent(){const item=current(),value=question.value.trim();if(!value){question.focus();showToast('先输入一个具体问题');return}clearTimeout(replyTimer);appendMessage('user',value,`来源节点：${item.title}`);ask.disabled=true;ask.textContent='Agent 思考中';const pending=appendMessage('agent','正在读取节点标题、正文与当前状态…',`上下文：${item.id}`);replyTimer=setTimeout(()=>{const answer=answerFor(item,value);item.answer=answer;item.status='已写回';pending.remove();appendMessage('agent',answer,`已写回原节点：${item.title}`);ask.disabled=false;ask.textContent='提问并写回';renderAll();requestAnimationFrame(()=>{const card=nodes.querySelector(`[data-id="${item.id}"]`);card?.classList.add('is-flashing');setTimeout(()=>card?.classList.remove('is-flashing'),850)});showToast('Agent 回复已写回原节点')},520)}
      function createAgentNode(){const parent=current(),title=newTitle.value.trim()||`${parent.title} · 后续动作`;created+=1;const id='agent-'+Date.now(),siblings=links.filter(link=>link[0]===parent.id).length;const item={id,title,copy:`由 Agent 根据「${parent.title}」创建。下一步需要补充负责人和完成条件。`,x:Math.min(1460,parent.x+360),y:Math.min(850,parent.y+120+siblings*90),status:'待开始',source:'AI',answer:''};tasks.push(item);links.push([parent.id,id]);active=id;newTitle.value='';renderAll();appendMessage('agent',`已新建节点「${title}」，并连接到「${parent.title}」。`,`画布新增：${id}`);showToast('Agent 已新建并连接节点')}
      function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;zoomLabel.textContent=Math.round(view.scale*100)+'%'}
      function screenToWorld(clientX,clientY){const rect=viewport.getBoundingClientRect();return{x:(clientX-rect.left-view.x)/view.scale,y:(clientY-rect.top-view.y)/view.scale}}
      function zoomAt(clientX,clientY,factor){const rect=viewport.getBoundingClientRect(),before=screenToWorld(clientX,clientY);view.scale=Math.min(1.5,Math.max(.42,view.scale*factor));view.x=clientX-rect.left-before.x*view.scale;view.y=clientY-rect.top-before.y*view.scale;applyView()}
      function showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('is-visible');toastTimer=setTimeout(()=>toast.classList.remove('is-visible'),1800)}
      viewport.addEventListener('pointerdown',event=>{if(event.target.closest('.node'))return;gesture={type:'pan',startX:event.clientX,startY:event.clientY,x:view.x,y:view.y};viewport.classList.add('is-panning')});window.addEventListener('pointermove',event=>{if(!gesture)return;const dx=event.clientX-gesture.startX,dy=event.clientY-gesture.startY;if(gesture.type==='pan'){view.x=gesture.x+dx;view.y=gesture.y+dy;applyView()}if(gesture.type==='node'){const item=tasks.find(task=>task.id===gesture.id);if(!item)return;item.x=Math.max(0,Math.min(1500,gesture.x+dx/view.scale));item.y=Math.max(0,Math.min(900,gesture.y+dy/view.scale));const node=nodes.querySelector(`[data-id="${item.id}"]`);if(node)node.style.transform=`translate(${item.x}px,${item.y}px)`;renderEdges()}});const endGesture=()=>{gesture=null;viewport.classList.remove('is-panning')};window.addEventListener('pointerup',endGesture);window.addEventListener('pointercancel',endGesture);viewport.addEventListener('wheel',event=>{event.preventDefault();zoomAt(event.clientX,event.clientY,event.deltaY<0?1.1:.9)},{passive:false});
      ask.addEventListener('click',askAgent);question.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter')askAgent()});document.querySelector('#createNode').addEventListener('click',createAgentNode);newTitle.addEventListener('keydown',event=>{if(event.key==='Enter')createAgentNode()});document.querySelector('#zoomIn').addEventListener('click',()=>{const r=viewport.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.12)});document.querySelector('#zoomOut').addEventListener('click',()=>{const r=viewport.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,.88)});document.querySelector('#fit').addEventListener('click',()=>{view={x:48,y:34,scale:.86};applyView()});document.querySelector('#reset').addEventListener('click',()=>{clearTimeout(replyTimer);clearTimeout(quoteTimer);ask.disabled=false;ask.textContent='提问并写回';resetData();view={x:48,y:34,scale:.86};transcript.querySelectorAll('.message:not(:first-child)').forEach(item=>item.remove());question.value='';question.dataset.for='';applyView();renderAll();showToast('演示已重置')});document.addEventListener('selectionchange',captureSelection);window.addEventListener('resize',renderEdges);
      resetData();applyView();renderAll();
    })();
  </script>
</body>
</html>
